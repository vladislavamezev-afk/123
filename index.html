/* ==========================================================================
   Созвездие: расположение звёзд, отрисовка, экспорт в PNG
   ========================================================================== */
const Con = {
  star: 'M0-9 2.2-2.2 9 0 2.2 2.2 0 9-2.2 2.2-9 0-2.2-2.2Z',
  get total() { return CONFIG.constellation.questions.length; },
  /* детерминированный «случай»: у каждого билета своё небо */
  rand(i, k) {
    let t = (hash(S.ticketNo || 'olu') + i * 7919 + k * 104729) >>> 0;
    t += 0x6D2B79F5; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  },
  /* положение звезды зависит от билета и от выбранного ответа */
  pos(i) {
    const n = this.total, a = S.con.answers[i], o = a && a.o >= 0 ? a.o : 2;
    const ang = this.rand(99, 0) * 6.283 + i * (6.283 / n) + (this.rand(i, 1) - 0.5) * 0.55;
    const r = 58 + this.rand(i, 2) * 74 + o * 7;
    return { x: 200 + Math.cos(ang) * r, y: 186 + Math.sin(ang) * r * 0.86 };
  },
  who(i) { return S.con.mode === 'duo' ? (i % 2 ? 'him' : 'her') : 'solo'; },
  links(n) { const L = []; for (let i = 1; i < n; i++) { L.push([i - 1, i, false]); if (i >= 3 && i % 2 === 1) L.push([i - 3, i, true]); } return L; },
  /* статичная карта (коллекция, финал) */
  svg(withName) {
    const n = S.con.answers.length; let h = '';
    for (const [a, b, x] of this.links(n)) { const p = this.pos(a), q = this.pos(b); h += `<line class="cline${x ? ' x' : ''}" x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}"/>`; }
    for (let i = 0; i < n; i++) { const p = this.pos(i); h += `<g class="cstar ${this.who(i)}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><circle r="15" fill="url(#gGlow)" opacity=".8"/><path d="${this.star}"/></g>`; }
    if (withName && S.con.name) h += `<text x="200" y="362" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#fff">${esc(S.con.name)}</text>`;
    return `<svg viewBox="0 0 400 ${withName ? 384 : 372}" preserveAspectRatio="xMidYMid meet">${h}</svg>`;
  },
  /* заставить статичную карту нарисоваться заново, линия за линией */
  animate(root) {
    $$('.cline', root).forEach((l, k) => {
      const len = Math.hypot(l.x2.baseVal.value - l.x1.baseVal.value, l.y2.baseVal.value - l.y1.baseVal.value);
      l.style.transition = 'none'; l.style.strokeDasharray = len; l.style.strokeDashoffset = len; l.getBoundingClientRect();
      l.style.transition = `stroke-dashoffset 1.4s ${0.6 + k * 0.28}s cubic-bezier(.22,.8,.26,1)`; l.style.strokeDashoffset = 0;
    });
    $$('.cstar', root).forEach((s, k) => { s.style.opacity = 0; s.getBoundingClientRect(); s.style.transition = `opacity 1.2s ${0.3 + k * 0.3}s ease`; s.style.opacity = 1; });
  },
  /* карта созвездия на Canvas — для сохранения в PNG */
  png() {
    const W = 1080, H = 1350, k = 2.7, oy = 130, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d'), n = S.con.answers.length, P = i => { const p = this.pos(i); return { x: p.x * k, y: p.y * k + oy }; };
    const bg = c.createRadialGradient(W / 2, H * 1.05, 0, W / 2, H * 0.6, H);
    bg.addColorStop(0, '#4a3288'); bg.addColorStop(0.45, '#171848'); bg.addColorStop(1, '#060818');
    c.fillStyle = bg; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 320; i++) {
      const x = this.rand(i, 11) * W, y = this.rand(i, 12) * H, r = 0.6 + this.rand(i, 13) * 2;
      c.globalAlpha = 0.25 + this.rand(i, 14) * 0.6; c.fillStyle = ['#ffffff', '#ffe9f1', '#e6dcff', '#fff3d6'][i % 4];
      c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
    }
    c.globalAlpha = 1; c.strokeStyle = 'rgba(255,255,255,.13)'; c.lineWidth = 2; c.setLineDash([4, 14]);
    [186 * k, 120 * k].forEach(r => { c.beginPath(); c.arc(W / 2, 190 * k + oy, r, 0, 6.283); c.stroke(); });
    c.setLineDash([]); c.lineCap = 'round'; c.shadowColor = 'rgba(255,227,163,.9)'; c.shadowBlur = 14;
    for (const [a, b, x] of this.links(n)) {
      const p = P(a), q = P(b); c.strokeStyle = x ? 'rgba(200,190,255,.5)' : 'rgba(255,236,214,.85)'; c.lineWidth = x ? 2 : 3;
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); c.stroke();
    }
    c.shadowBlur = 0;
    const col = { her: '#ffd9e6', him: '#bfe0ff', solo: '#fff3d6' };
    for (let i = 0; i < n; i++) {
      const p = P(i), g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, 46);
      g.addColorStop(0, 'rgba(255,245,214,.95)'); g.addColorStop(0.4, 'rgba(255,227,163,.35)'); g.addColorStop(1, 'rgba(255,227,163,0)');
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, 46, 0, 6.283); c.fill();
      c.save(); c.translate(p.x, p.y); c.scale(k, k); c.fillStyle = col[this.who(i)];
      c.beginPath(); c.moveTo(0, -9); [[2.2, -2.2], [9, 0], [2.2, 2.2], [0, 9], [-2.2, 2.2], [-9, 0], [-2.2, -2.2]].forEach(v => c.lineTo(v[0], v[1])); c.closePath(); c.fill(); c.restore();
    }
    const spaced = s => String(s).toUpperCase().split('').join('\u200A\u200A');
    c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,.6)'; c.font = '26px Arial, sans-serif';
    c.fillText(spaced(CONFIG.title), W / 2, 92);
    c.fillStyle = '#ffffff'; c.shadowColor = 'rgba(255,214,232,.9)'; c.shadowBlur = 26;
    let fs = 70; const nm = S.con.name || CONFIG.constellation.defaultName;
    do { c.font = `italic ${fs}px Georgia, "Times New Roman", serif`; fs -= 4; } while (c.measureText(nm).width > W - 140 && fs > 28);
    c.fillText(nm, W / 2, 1142); c.shadowBlur = 0;
    c.fillStyle = 'rgba(255,255,255,.55)'; c.font = '22px Arial, sans-serif'; c.fillText(spaced(CONFIG.constellation.mapCaption), W / 2, 1196);
    c.fillStyle = 'rgba(255,233,241,.9)'; c.font = '30px Georgia, serif';
    c.fillText(`${herName()}  ·  ${CONFIG.hisName}  ·  ${S.date}`, W / 2, 1278);
    return cv;
  },
  /* сохранить PNG: скачивание + предпросмотр (на телефоне картинку можно удержать пальцем) */
  export() {
    let cv, url = '';
    try { cv = this.png(); url = cv.toDataURL('image/png'); } catch (e) { UI.say(T.errorRecovered); return; }
    const file = 'our-little-universe.png';
    const download = () => {
      try {
        cv.toBlob(b => {
          if (!b) return;
          const u = URL.createObjectURL(b), a = document.createElement('a');
          a.href = u; a.download = file; a.style.display = 'none'; document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(u), 5000);
        }, 'image/png');
      } catch (e) { /* останется предпросмотр */ }
    };
    Con.lastExport = url.length;
    download(); Sound.play('found');
    UI.card({
      title: S.con.name || CONFIG.constellation.defaultName,
      custom({ body, acts, close }) {
        body.innerHTML = `<img class="png-prev" alt="" src="${url}"><p class="small-note">${esc(CONFIG.constellation.saveHint)}</p>`;
        const again = mkBtn(T.download, 'btn small'); again.onclick = download; acts.appendChild(again);
        try {
          cv.toBlob(b => {
            if (!b || !navigator.canShare) return;
            const f = new File([b], file, { type: 'image/png' });
            if (!navigator.canShare({ files: [f] })) return;
            const sh = mkBtn(T.share, 'btn small'); sh.onclick = () => { navigator.share({ files: [f] }).catch(() => {}); };
            acts.insertBefore(sh, acts.firstChild);
          }, 'image/png');
        } catch (e) { /* без кнопки «поделиться» */ }
        const cl = mkBtn(T.close, 'btn ghost'); cl.onclick = () => close(true); acts.appendChild(cl);
      }
    });
  }
};

/* билет, который можно перевернуть */
function ticketFlip(printing) {
  const d = document.createElement('div'); d.className = 'flip';
  d.innerHTML = `<div class="flip-in"><div class="face">${Art.ticket(printing)}</div><div class="face back">${para(CONFIG.intro.ticket.back)}</div></div>`;
  d.onclick = () => { d.classList.toggle('turned'); Sound.play('paper'); Secret.find('ticketBack', 800); };
  return d;
}

/* показать цветок и всё послание */
function showFlower() {
  const G = CONFIG.garden, pages = [];
  for (let i = 0; i < G.phrases.length; i += 5) pages.push(G.phrases.slice(i, i + 5).join('\n'));
  pages.push(G.finalLine);
  return UI.card({ art: Art.flower(S.garden.color), title: G.flowerTitle, pages });
}

/* ==========================================================================
   App: переходы между станциями, HUD, карта маршрута, коллекция, сброс
   ========================================================================== */
const Scenes = {};
const App = {
  current: null, token: 0, busy: false, lastTouch: Date.now(),
  idx(scene) { return ORDER.indexOf(scene); },
  unlocked(scene) { return scene === 'aurora' ? Secret.has('combo') : this.idx(scene) >= 0 && this.idx(scene) <= S.stage; },

  async go(scene, { travel = false, instant = false } = {}) {
    if (this.busy || !Scenes[scene]) return;
    this.busy = true;
    try {
      UI.closeAll(); Room.close(true);
      const tok = ++this.token, prev = this.current, veil = $('#veil'), tr = $('#travel');
      veil.classList.remove('white');
      if (travel) {
        const st = CONFIG.stations[scene], backward = prev && this.idx(prev) > this.idx(scene) && this.idx(scene) >= 0;
        $('#tr-k').textContent = backward ? T.backTo : T.nextStation; $('#tr-name').textContent = st.name; $('#tr-ru').textContent = st.ru;
        tr.classList.remove('off'); tr.classList.add('on'); Sound.play('whoosh'); await wait(720);
      } else if (!instant) { veil.classList.add('on'); await wait(660); }
      if (prev) { try { if (Scenes[prev].leave) Scenes[prev].leave(); } catch (e) { console.error(e); } $('#sc-' + prev).classList.remove('active'); }
      this.current = scene; document.body.dataset.scene = scene; $('#sc-' + scene).classList.add('active');
      if (ORDER.includes(scene)) { S.scene = scene; Store.save(); }
      this.hud();
      if (travel) await wait(2500);
      try { Scenes[scene].enter(tok); } catch (e) { console.error(e); }
      if (Scenes[scene].chip) Scenes[scene].chip();
      if (travel) { tr.classList.add('off'); await wait(700); tr.classList.remove('on', 'off'); }
      else if (!instant) { await wait(120); veil.classList.remove('on'); }
    } finally { this.busy = false; }
  },
  advance(scene) { const i = this.idx(scene); if (i > S.stage) { S.stage = i; Store.save(); } return this.go(scene, { travel: true }); },
  back() {
    if ($('#room').classList.contains('on')) return Room.close();
    if ($('.overlay.on')) return UI.closeAll();
    if (this.current === 'aurora') return this.go('wonders');
    const i = this.idx(this.current); if (i > 0) this.go(ORDER[i - 1], { travel: true });
  },
  hud() {
    $('#hud').classList.toggle('intro', !S.introDone);
    $('#btn-back').disabled = this.current === 'station';
  },
  closePanel() { return UI.closeOverlay($('#panel')); },
  sheet(title, inner) {
    const p = $('#panel');
    p.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" data-x type="button" aria-label="${esc(T.close)}"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>${inner}</div>`;
    p.classList.remove('closing'); p.classList.add('on');
    p.onclick = e => { if (e.target === p) this.closePanel(); };
    $('[data-x]', p).onclick = () => { Sound.play('tap'); this.closePanel(); };
    return p;
  },

  /* карта маршрута: возврат на любую открытую станцию */
  openMap() {
    if (!S.introDone) return;
    Sound.play('tap');
    const stops = ORDER.concat(Secret.has('combo') ? ['aurora'] : []);
    const rows = stops.map((id, i) => {
      const st = CONFIG.stations[id], open = this.unlocked(id), here = id === this.current, sec = id === 'aurora';
      const dot = sec ? use('s-star', 'fill="#2a1d4d"') : `<span class="h-serif">${i + 1}</span>`;
      const sub = !open ? T.locked : (sec ? T.secretStation : st.ru) + (here ? ' · ' + T.here : '');
      return `<button type="button" class="stop${open ? ' done' : ' locked'}${here ? ' here' : ''}${sec ? ' secret-stop' : ''}" data-go="${id}"><span class="dot">${dot}</span><span><span class="nm">${open ? esc(st.name) : '· · ·'}</span><span class="ru">${esc(sub)}</span></span></button>`;
    }).join('');
    const p = this.sheet(T.mapTitle, `<div class="route">${rows}</div><div class="sheet-foot"><button type="button" class="map-train" aria-label="поезд"><svg viewBox="0 0 300 80"><use href="#train"/></svg></button><button type="button" class="btn ghost small" data-restart>${esc(T.restart)}</button></div>`);
    $$('[data-go]', p).forEach(b => b.onclick = () => {
      const id = b.dataset.go; if (!this.unlocked(id)) return;
      if (id === this.current) return this.closePanel();
      this.go(id, { travel: id !== 'aurora' });
    });
    let toots = 0; const train = $('.map-train', p);
    train.onclick = () => {
      Sound.play('whistle'); train.classList.add('run'); setTimeout(() => train.classList.remove('run'), 1300);
      if (++toots >= 3) Secret.find('mapTrain', 300);
    };
    $('[data-restart]', p).onclick = () => this.confirmRestart();
  },

  /* сброс прогресса — только через удержание, чтобы не нажать случайно */
  confirmRestart() {
    Sound.play('tap');
    UI.card({
      title: T.restartTitle, pages: [T.restartText + '\n' + T.restartHold],
      custom({ body, acts, close }) {
        const w = document.createElement('div'); w.style.marginTop = '18px'; w.innerHTML = UI.holdHTML('danger', use('s-star', 'class="seal" fill="#5a3b86"'));
        body.appendChild(w);
        UI.hold($('.hold', w), 2000, () => { Store.reset(); S = Store.defaults(); App.noSave = true; $('#veil').classList.add('on'); setTimeout(() => location.reload(), 500); });
        const no = mkBtn(T.restartCancel, 'btn primary'); no.onclick = () => close(false); acts.appendChild(no);
      }
    });
  },

  /* коллекция: всё найденное можно открыть снова */
  openCollection() {
    if (!S.introDone) return;
    Sound.play('tap');
    const w = S.wonders.found.length, e = S.envelopes.length, s = S.secrets.length, envIcon = `<svg viewBox="0 0 100 100"><rect x="14" y="28" width="72" height="46" rx="7" fill="url(#gRose)" stroke="#fff"/><path d="M14 32l36 26 36-26" fill="none" stroke="#fff" stroke-width="2"/></svg>`;
    const items = [
      { k: 'ticket', wide: true, on: !!S.ticketNo, ic: Art.ticketIcon(), nm: T.collTicket, sub: '№ ' + S.ticketNo },
      { k: 'wonders', on: w > 0, ic: use('s-star', 'fill="url(#gStar)"'), nm: T.collWonders, sub: `${w} / ${WONDER_IDS.length}` },
      { k: 'envelopes', on: e > 0, ic: envIcon, nm: T.collEnvelopes, sub: String(e) },
      { k: 'flower', on: S.garden.bloomed, ic: S.garden.bloomed ? Art.flower(S.garden.color) : use('s-heart', 'fill="rgba(255,255,255,.35)"'), nm: T.collFlower, sub: S.garden.bloomed ? Art.color(S.garden.color).name : '' },
      { k: 'con', on: S.con.done, ic: S.con.done ? Con.svg(false) : use('s-star', 'fill="rgba(255,255,255,.35)"'), nm: T.collCon, sub: S.con.done ? S.con.name : '' },
      { k: 'secrets', wide: true, on: s > 0, ic: use('s-moon', 'fill="url(#gGold)"'), nm: T.collSecrets, sub: String(s) }
    ];
    const p = this.sheet(T.collTitle, `<div class="coll-grid">${items.map(it => `<button type="button" class="coll${it.wide ? ' wide' : ''}${it.on ? '' : ' empty'}" data-k="${it.k}"><span class="ic">${it.ic}</span><span class="nm">${esc(it.nm)}</span><span class="sub">${esc(it.on ? it.sub : T.collEmpty)}</span></button>`).join('')}</div>`);
    const open = {
      ticket: () => UI.card({ custom({ body, acts, close }) { body.appendChild(ticketFlip(false)); const h = document.createElement('div'); h.className = 'flip-hint'; h.textContent = T.ticketFlip; body.appendChild(h); const b = mkBtn(T.close, 'btn ghost'); b.onclick = () => close(true); acts.appendChild(b); } }),
      wonders: () => UI.card({ title: T.collWonders, custom({ body, acts, close }) {
        body.innerHTML = `<div class="list">${WONDER_IDS.map(id => S.wonders.found.includes(id) ? `<div class="row">${esc(CONFIG.wonders[id].title)}</div>` : `<div class="row dim">· · · ${esc(T.notFound)}</div>`).join('')}</div>`;
        const b = mkBtn(T.close, 'btn ghost'); b.onclick = () => close(true); acts.appendChild(b);
      } }),
      envelopes: () => UI.card({ title: T.collEnvelopes, custom({ body, acts, close }) {
        const l = document.createElement('div'); l.className = 'list';
        S.envelopes.forEach(id => { const b = document.createElement('button'); b.type = 'button'; b.textContent = CONFIG.envelopes[id].kicker; b.onclick = () => Envelope.open(id); l.appendChild(b); });
        body.appendChild(l); const b = mkBtn(T.close, 'btn ghost'); b.onclick = () => close(true); acts.appendChild(b);
      } }),
      flower: () => showFlower(),
      con: () => UI.card({ title: S.con.name, custom({ body, acts, close }) {
        body.innerHTML = `<div class="con-art">${Con.svg(false)}</div><p class="small-note">${esc(CONFIG.constellation.mapCaption)}</p>`;
        const sv = mkBtn(CONFIG.constellation.saveButton, 'btn primary'); sv.onclick = () => Con.export(); acts.appendChild(sv);
        const b = mkBtn(T.close, 'btn ghost'); b.onclick = () => close(true); acts.appendChild(b);
      } }),
      secrets: () => UI.card({ title: T.collSecrets, custom({ body, acts, close }) {
        const all = Object.keys(CONFIG.secrets).length;
        body.innerHTML = `<div class="list">${S.secrets.map(id => `<div class="row"><span><b>${esc(CONFIG.secrets[id].title)}</b><br><span style="opacity:.75">${esc(fill(CONFIG.secrets[id].text))}</span></span></div>`).join('')}</div>${S.secrets.length < all ? `<p class="small-note">${esc(T.collMoreSecrets)}</p>` : ''}`;
        const b = mkBtn(T.close, 'btn ghost'); b.onclick = () => close(true); acts.appendChild(b);
      } })

    $$('[data-k]', p).forEach(b => b.onclick = () => { Sound.play('tap'); open[b.dataset.k](); });
  }

Scenes.station = {
  chip() { UI.chip(''); },
  enter(tok) {
    const sc = $('#sc-station'); sc.className = 'scene active';
    FX.flies(6); $('#intro-lines').innerHTML = ''; $('#intro-tap').classList.remove('on');
    if (S.name && S.ticketNo) {
      FX.stars(1, 0.03); document.body.classList.add('lit'); sc.classList.add('s-art');
      this.showTicket(false, S.introDone);
      return;
    }
    this.intro(tok, sc);
  },
  async intro(tok, sc) {
    FX.starsNow(0); FX.stars(1, 0.006); document.body.classList.remove('lit');
    const tip = $('#sound-tip'); tip.textContent = T.soundTip;
    await wait(1500); if (tok !== App.token) return;
    sc.classList.add('s-art'); tip.classList.add('on'); setTimeout(() => tip.classList.remove('on'), 7000);
    await wait(1500); if (tok !== App.token) return;
    document.body.classList.add('lit'); $('#intro-tap').classList.add('on');
    const ok = await revealLines($('#intro-lines'), CONFIG.intro.lines, { gap: 1500, tapEl: sc, tok });
    $('#intro-tap').classList.remove('on'); if (!ok) return;
    await wait(700); if (tok !== App.token) return;
    const preset = (CONFIG.herName || '').trim();
    if (preset) this.issue(preset); else sc.classList.add('s-form');
  },
  submit() {
    const inp = $('#name-input'), v = inp.value.replace(/\s+/g, ' ').trim().slice(0, 24);
    if (!v) { inp.classList.remove('bad'); void inp.offsetWidth; inp.classList.add('bad'); Sound.play('nope'); UI.say(T.nameEmpty, 2600); return; }
    inp.blur(); this.issue(v);
  },
  /* выдача билета: имя, дата и уникальный номер */
  issue(name) {
    S.name = name;
    S.ticketNo = 'OLU-' + String(hash(name + Date.now()) % 10000).padStart(4, '0') + '-' + String.fromCharCode(65 + Math.floor(rnd(0, 26)), 65 + Math.floor(rnd(0, 26)));
    S.date = (CONFIG.date || '').trim() || new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    Store.save(); Sound.play('print');
    this.showTicket(true, false);
    const slot = $('#ticket-slot'); setTimeout(() => { if (App.current === 'station') { FX.burstAt(slot, { n: 30, speed: 3, cols: ['#ffd9e6', '#fff3c0', '#e6dcff'] }); FX.twinkle(); } }, 2400);
  },
  showTicket(printing, revisit) {
    const sc = $('#sc-station'), slot = $('#ticket-slot');
    sc.classList.remove('s-form'); sc.classList.add(revisit ? 's-revisit' : 's-ticket');
    slot.innerHTML = ''; slot.appendChild(ticketFlip(printing));
    const b = $('#btn-depart'); b.textContent = revisit ? CONFIG.intro.revisitButton : CONFIG.intro.departButton;
    b.onclick = revisit ? () => App.openMap() : () => this.depart();
  },
  async depart() {
    if (this.leaving || App.busy) return; this.leaving = true;
    S.introDone = true; if (S.stage < 1) S.stage = 1; Store.save();
    $('#sc-station').classList.add('s-depart'); Sound.play('whistle'); FX.twinkle();
    await wait(1900);
    this.leaving = false;
    App.go('wonders', { travel: true });
  },
  clock() {
    const c = $('#st-clock'); if (c.classList.contains('spin')) return;
    c.classList.add('spin'); Sound.play('bell'); setTimeout(() => c.classList.remove('spin'), 1700);
    Secret.find('clock', 900);
  }
};

Scenes.wonders = {
  built: false, lock: false, rings: 0, seq: [], raf: 0, ft: 0, dash: 0, restUntil: 0, frame: 0,
  count() { return S.wonders.found.length; },
  chip() {
    UI.chip(`${esc(T.wondersChip)} <b>${this.count()}</b>/${WONDER_IDS.length}`);
  },
  build() {
    const world = $('#world'), st = CONFIG.stations.wonders; let dim = '', near = '';
    for (let i = 0; i < 9; i++) dim += `<i class="puff dim" style="left:${(i % 2 ? 48 : -14) + (i * 13) % 20}%;top:${180 + i * 300}px;width:${260 + (i * 37) % 120}px;height:${110 + (i * 23) % 50}px"></i>`;
    for (let i = 0; i < 8; i++) near += `<i class="puff" style="left:${(i % 2 ? -8 : 58) + (i * 17) % 16}%;top:${420 + i * 290}px;width:${170 + (i * 41) % 90}px;height:${64 + (i * 19) % 34}px;opacity:.55"></i>`;
    world.innerHTML = `<div class="w-layer" data-k="0.3">${dim}</div><div class="w-layer" data-k="-0.1">${near}</div>
      <div class="w-head"><div class="kicker">${esc(st.ru)}</div><h2>${esc(st.name)}</h2><p>${esc(CONFIG.wondersIntro)}</p><div class="scroll-cue"></div></div>`
      + WDEF.map(d => `<button type="button" class="wonder" id="w-${d.id}" data-w="${d.id}" aria-label="${esc(CONFIG.wonders[d.id].title)}" style="${d.x != null ? `left:${d.x}%;top:${d.y}px;` : ''}width:${d.w}px;height:${d.h || d.w}px"><span class="gl"></span><span class="fl">${d.svg}</span><span class="caption"></span></button>`).join('')
      + `<button type="button" class="hid" id="h-quiet" style="left:90%;top:612px" aria-label="…"><i></i></button>
         <button type="button" class="hid" id="h-spark" style="left:44%;top:806px" aria-label="…"><i></i></button>
         <div class="w-next"><p id="w-need"></p></div>
         <button type="button" class="hid" id="h-grass" style="left:50%;top:2570px">${esc(T.signature)}</button>`;
    $$('.wonder', world).forEach(b => b.addEventListener('click', () => this.tap(b.dataset.w)));
    const hid = (id, sec) => { $('#' + id).onclick = e => { const el = e.currentTarget; if (Secret.find(sec)) { el.classList.add('got'); FX.burstAt(el, { n: 20, cols: ['#fff3c0', '#ffd9e6'], speed: 2.4 }); } }; };
    hid('h-quiet', 'quiet'); hid('h-spark', 'spark'); hid('h-grass', 'grass');
    const layers = $$('.w-layer', world), sc = $('#w-scroller');
    sc.addEventListener('scroll', () => { const y = sc.scrollTop; FX.scroll(y); layers.forEach(l => { l.style.transform = `translate3d(0,${(y * parseFloat(l.dataset.k)).toFixed(1)}px,0)`; }); }, { passive: true });
    $('#btn-w-next').onclick = () => App.advance('garden');
    this.built = true;
  },
  enter() {
    FX.stars(0.85, 0.03); FX.flies(10); document.body.classList.add('lit');
    if (!this.built) this.build();
    if (!this.count()) $('#w-scroller').scrollTop = 0;
    FX.scroll($('#w-scroller').scrollTop); this.seq = []; this.rings = 0; this.lock = false;
    this.refresh();
    cancelAnimationFrame(this.raf); let last = performance.now();
    const fly = $('#w-butterfly'), world = $('#world');
    const loop = t => {
      this.raf = requestAnimationFrame(loop);
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (t > this.restUntil) { fly.classList.remove('rest'); this.ft += dt * (1 + this.dash * 5); this.dash *= 0.97; }
      const W = world.clientWidth, x = W * (0.5 + 0.34 * Math.sin(this.ft * 0.23)) - 38, y = 1150 + 640 * Math.sin(this.ft * 0.17 + 1) + 26 * Math.sin(this.ft * 1.3);
      fly.style.transform = `translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0)`;
      if (++this.frame % 5 === 0 && t > this.restUntil) { const r = fly.getBoundingClientRect(); if (r.bottom > 0 && r.top < FX.H) FX.trail(r.left + r.width / 2, r.top + r.height / 2, { cols: ['#ffc2d9', '#e6dcff', '#fff3c0'], size: 9, life: 60 }); }
    };
    this.raf = requestAnimationFrame(loop);
  },
  leave() { cancelAnimationFrame(this.raf); FX.scroll(0); },
  refresh() {
    const n = this.count(), C = CONFIG;
    WONDER_IDS.forEach(id => {
      const el = $('#w-' + id), f = S.wonders.found.includes(id); if (!el) return;
      el.classList.toggle('found', f);
      const cap = $('.caption', el); cap.textContent = f ? C.wonders[id].title : ''; cap.classList.toggle('on', f);
    });
    $('#w-cloud').classList.toggle('heart', S.wonders.cloudHeart);
    $('#h-spark').classList.toggle('live', S.wonders.cloudHeart);
    $('#w-crystal').classList.toggle('solved', S.wonders.found.includes('crystal'));
    [['h-quiet', 'quiet'], ['h-spark', 'spark'], ['h-grass', 'grass']].forEach(([el, sec]) => $('#' + el).classList.toggle('got', Secret.has(sec)));
    const others = S.wonders.found.filter(x => x !== 'door').length, lit = Math.round(Math.min(1, others / C.wondersDoorNeeds) * 5);
    $$('#w-door .rune').forEach((r, i) => r.classList.toggle('on', i < lit));
    const left = C.wondersToContinue - n, ready = left <= 0 || S.stage >= 2;
    $('#w-dock').classList.toggle('on', ready); $('#btn-w-next').textContent = T.wondersNext;
    $('#w-need').textContent = ready ? T.wondersEnough : fill(T.wondersNeed, { n: left });
    this.chip();
  },
  mark(id) {
    if (S.wonders.found.includes(id)) return false;
    S.wonders.found.push(id); Store.save(); Sound.play('found'); this.refresh();
    const n = this.count();
    if (n === WONDER_IDS.length) setTimeout(() => UI.say(T.wondersAll, 5000), 1400);
    else if (n === CONFIG.wondersToContinue && S.stage < 2) setTimeout(() => UI.say(T.wondersReady, 5200), 1400);
    return true;
  },
  art(id) { return WDEF.find(d => d.id === id).svg; },
  show(id, art) { const c = CONFIG.wonders[id]; return UI.card({ art: art || this.art(id), title: c.title, pages: c.pages || [c.text] }); },
  async tap(id) {
    const el = $('#w-' + id); if (!el || this.lock) return;
    /* секретная комбинация: порядок касаний подсказан в тайной комнате */
    this.seq.push(id); this.seq = this.seq.slice(-CONFIG.combo.length);
    if (CONFIG.combo.length > 1 && this.seq.join() === CONFIG.combo.join()) { this.seq = []; return this.aurora(el); }
    el.classList.remove('tapped'); void el.offsetWidth; el.classList.add('tapped'); setTimeout(() => el.classList.remove('tapped'), 520);
    this.lock = true;
    try { await this.on[id].call(this, el, CONFIG.wonders[id]); } catch (e) { console.error(e); } finally { this.lock = false; }
  },
  async aurora(el) {
    this.lock = true;
    Sound.play('secret'); FX.burstAt(el, { n: 40, speed: 4, cols: ['#59f0c2', '#a8b8ff', '#f7a8d0', '#ffffff'] }); FX.shower(10);
    Secret.find('combo', 200);
    await wait(2300); this.lock = false;
    if (App.current === 'wonders') App.go('aurora');
  },
  on: {
    async star(el) {
      el.classList.add('go'); setTimeout(() => el.classList.remove('go'), 1000);
      FX.burstAt(el, { n: 28, speed: 3.2, cols: ['#fff3c0', '#ffe3a3', '#ffffff'] }); Sound.play('star'); this.mark('star');
      await wait(650); await this.show('star');
    },
    async envelope() { if (await Envelope.open('first')) this.mark('envelope'); },
    async cloud(el) {
      const was = S.wonders.cloudHeart;
      if (was) { el.classList.remove('heart'); await wait(500); el.classList.add('heart'); }
      S.wonders.cloudHeart = true; Store.save(); el.classList.add('heart'); $('#h-spark').classList.add('live');
      FX.burstAt(el, { n: 24, speed: 2.4, cols: ['#ffc2d9', '#f9a9c6', '#ffffff'], g: -0.01 }); Sound.play('soft'); this.mark('cloud');
      await wait(1100); await this.show('cloud', use('s-heart', 'fill="#f9a9c6"'));
    },
    async moon(el) {
      el.classList.toggle('full', !el.classList.contains('full') || !S.wonders.found.includes('moon')); Sound.play('soft'); this.mark('moon');
      await wait(900); await this.show('moon');
    },

Scenes.sky = {
  lock: false, taps: 0, dust: false,
  chip() { UI.chip(`${esc(T.skyChip)} <b>${S.con.answers.length}</b>/${Con.total}`); },
  enter() {
    FX.stars(1, 0.03); FX.flies(3); document.body.classList.add('lit'); this.lock = false;
    if (!this.dust) {
      let d = ''; for (let i = 0; i < 46; i++) d += `<circle cx="${(Con.rand(i, 21) * 400).toFixed(1)}" cy="${(Con.rand(i, 22) * 380).toFixed(1)}" r="${(0.4 + Con.rand(i, 23)).toFixed(2)}" fill="#fff" opacity="${(0.2 + Con.rand(i, 24) * 0.5).toFixed(2)}"/>`;
      $('#sky-dust').innerHTML = d; this.dust = true;
      $('#sky-map').addEventListener('click', e => { if (!e.target.closest('.cstar')) this.emptyTap(); });
      $('#btn-scope').onclick = () => this.scope();
    }
    $('#sky-lines').innerHTML = ''; $('#sky-stars').innerHTML = '';
    for (let i = 0; i < S.con.answers.length; i++) this.addStar(i, false);
    this.setName(false); this.panel(true);
  },
  addStar(i, anim) {
    const lines = $('#sky-lines'), stars = $('#sky-stars'), p = Con.pos(i);
    Con.links(i + 1).filter(l => l[1] === i).forEach(([a, , x], k) => {
      const q = Con.pos(a), len = Math.hypot(p.x - q.x, p.y - q.y);
      lines.insertAdjacentHTML('beforeend', `<line class="cline${x ? ' x' : ''}" x1="${q.x.toFixed(1)}" y1="${q.y.toFixed(1)}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" stroke-dasharray="${len.toFixed(1)}"/>`);
      const l = lines.lastElementChild;
      if (anim) { l.style.strokeDashoffset = len; l.getBoundingClientRect(); l.style.transitionDelay = (0.2 + k * 0.5) + 's'; l.style.strokeDashoffset = 0; }
    });
    stars.insertAdjacentHTML('beforeend', `<g class="cstar ${Con.who(i)}" data-i="${i}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><circle class="halo" r="15" fill="url(#gGlow)"/><g class="${anim ? 'in' : ''}"><path d="${Con.star}"/></g><circle r="21" fill="transparent"/></g>`);
    const s = stars.lastElementChild;
    s.addEventListener('click', () => {
      const a = S.con.answers[i]; if (!a) return; Sound.play('star'); FX.burstAt(s, { n: 12, cols: ['#fff3c0', '#ffffff'] });
      const who = S.con.mode === 'duo' ? ` (${i % 2 ? CONFIG.hisName : herName()})` : '';
      UI.toast(`${esc(T.starAnswer)}<br><i>«${esc(a.a)}»</i>${esc(who)}`, 4200);
    });
    if (anim) FX.burstAt(s, { n: 26, speed: 3, cols: ['#fff3c0', '#ffe3a3', '#ffffff'] });
  },
  setName(anim) {
    const t = $('#sky-name'), sub = $('#sky-sub');
    if (!S.con.done || !S.con.name) { t.textContent = ''; sub.textContent = ''; return; }
    t.style.whiteSpace = 'pre'; t.setAttribute('font-size', S.con.name.length > 20 ? 17 : 22);
    t.innerHTML = Array.from(S.con.name).map((ch, i) => `<tspan style="animation-delay:${anim ? (0.4 + i * 0.09).toFixed(2) : 0}s">${ch === " " ? "\u00A0" : esc(ch)}</tspan>`).join('');
    sub.textContent = CONFIG.constellation.mapCaption;
  },
  emptyTap() {
    FX.twinkle(); Sound.play('soft');
    if (++this.taps % 4 === 0) { FX.shoot(true); Secret.find('wish', 500); }
  },
  scope() {
    const P = CONFIG.constellation.planet; Sound.play('whoosh'); Secret.find('planet', 900);
    UI.card({ title: P.title, pages: [P.text], art: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="url(#gPinkGlow)" opacity=".55"/><circle cx="50" cy="50" r="24" fill="url(#gRose)"/><path d="M30 44q20 8 40-2" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="50" cy="52" rx="42" ry="9" fill="none" stroke="#ffe3a3" stroke-width="2" transform="rotate(-16 50 52)"/><circle cx="14" cy="22" r="1.500" fill="#fff"/><circle cx="86" cy="80" r="1.200" fill="#fff"/><circle cx="80" cy="16" r="1" fill="#fff"/></svg>` });
  },
  async answer(text, o) {
    text = String(text).replace(/\s+/g, ' ').trim().slice(0, 80);
    if (!text || this.lock || S.con.answers.length >= Con.total) return;
    this.lock = true;
    S.con.answers.push({ a: text, o }); Store.save(); Sound.play('star'); FX.twinkle();
    this.addStar(S.con.answers.length - 1, true); this.chip();
    await wait(1100); this.lock = false;
    if (App.current === 'sky') this.panel();
  },
  panel(instant) {
    const p = $('#sky-panel'), C = CONFIG.constellation;
    const build = () => {
      const n = S.con.answers.length; p.innerHTML = ''; p.scrollTop = 0;
      const add = html => { p.insertAdjacentHTML('beforeend', html); return p.lastElementChild; };
      if (!S.con.mode) {
        add(`<h3>${esc(C.invite)}</h3>`); add(`<p class="lead">${esc(C.inviteSub)}</p>`);
        const box = add('<div class="choices"></div>');
        [['solo', C.modeSolo], ['duo', C.modeDuo]].forEach(([m, label]) => { const b = mkBtn(label, 'choice'); b.style.textAlign = 'center'; b.onclick = () => { S.con.mode = m; Store.save(); Sound.play('tap'); this.panel(); }; box.appendChild(b); });
      } else if (n < Con.total) {
        const q = C.questions[n], duo = S.con.mode === 'duo', him = duo && n % 2 === 1;
        add(`<div class="q-prog">${C.questions.map((_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</div>`);
        if (duo) add(`<div style="text-align:center"><span class="who ${him ? 'him' : 'her'}">${esc(fill(him ? C.turnHim : C.turnHer))}</span></div>`);
        add(`<h3>${esc(fill(q.q))}</h3>`);
        const box = add('<div class="choices"></div>');
        q.options.forEach((o, i) => { const b = mkBtn(fill(o), 'choice'); b.onclick = () => this.answer(fill(o), i); box.appendChild(b); });
        const own = add(`<form class="own"><input class="field" type="text" maxlength="60" placeholder="${esc(C.ownPlaceholder)}" enterkeyhint="done"><button class="btn small" type="submit">${esc(T.answer)}</button></form>`);
        own.onsubmit = e => { e.preventDefault(); const inp = $('input', own); if (!inp.value.trim()) { inp.focus(); return; } inp.blur(); this.answer(inp.value, -1); };
      } else if (!S.con.done) {
        add(`<h3>${esc(C.nameTitle)}</h3>`); add(`<p class="lead">${esc(C.nameSub)}</p>`);
        const f = add(`<form><input class="field" type="text" maxlength="28" placeholder="${esc(C.defaultName)}" enterkeyhint="done"><div style="text-align:center;margin-top:12px"><button class="btn primary" type="submit">${esc(C.nameButton)}</button></div></form>`);
        $('input', f).value = S.con.name || '';
        f.onsubmit = e => {
          e.preventDefault(); const inp = $('input', f); inp.blur();
          S.con.name = inp.value.replace(/\s+/g, ' ').trim().slice(0, 28) || C.defaultName; S.con.done = true; if (S.stage < 4) S.stage = 4; Store.save();
          Sound.play('bloom'); FX.twinkle(); FX.shower(5); this.setName(true); this.panel();
        };
      } else {
        add(`<h3>«${esc(S.con.name)}»</h3>`); add(`<p class="lead">${esc(C.doneLead)}</p>`);
        const row = add('<div class="row-btns"></div>');
        const next = mkBtn(C.nextButton, 'btn primary'); next.onclick = () => App.advance('last');
        const save = mkBtn(C.saveButton, 'btn small'); save.onclick = () => Con.export();
        const ren = mkBtn(C.renameButton, 'btn ghost small'); ren.onclick = () => { S.con.done = false; Store.save(); Sound.play('tap'); this.setName(false); this.panel(); };
        row.append(next, save, ren);
      }
      this.chip();
    };
    if (instant) return build();
    p.classList.add('swap'); setTimeout(() => { build(); p.classList.remove('swap'); }, 380);
  }
};

/* ==========================================================================
   ЭТАП 5. THE LAST DESTINATION
   ========================================================================== */
Scenes.last = {
  running: false,
  chip() { UI.chip(''); },
  phase(id) { $$('#sc-last .phase').forEach(p => p.classList.toggle('on', p.id === 'ph-' + id)); },
  alive(tok) { return tok === App.token && App.current === 'last'; },
  enter(tok) {
    FX.stars(1, 0.03); FX.flies(8); document.body.classList.add('lit'); this.running = false;
    $('#bigdoor').classList.remove('open'); this.door(tok);
  },
  leave() { FX.unform(); $('#veil').classList.remove('white'); },
  async door(tok) {
    const F = CONFIG.finale, txt = $('#door-txt'), acts = $('#door-acts');
    this.phase('door'); txt.innerHTML = ''; acts.innerHTML = '';
    if (S.finale.revealed) {
      txt.innerHTML = `<p class="rl in">${esc(fill(F.hub))}</p>`;
      const a = mkBtn(F.letterButton, 'btn primary'); a.onclick = () => this.letter();
      const b = mkBtn(F.endButton, 'btn small'); b.onclick = () => this.hand();
      const c = mkBtn(F.replayButton, 'btn ghost small'); c.onclick = () => this.sequence();
      acts.append(a, b, c); return;
    }
    const ok = await revealLines(txt, F.doorLines, { gap: 1300, tapEl: $('#ph-door'), tok }); if (!ok) return;
    const b = mkBtn(F.doorButton, 'btn primary'); b.onclick = () => this.sequence(); acts.appendChild(b);
  },
  async flash(fn) {
    const v = $('#veil'); v.classList.add('white', 'on'); await wait(750); fn(); await wait(150); v.classList.remove('on'); await wait(700); v.classList.remove('white');
  },
  /* дверь открывается -> всё найденное собирается в одну композицию -> поворот сюжета */
  async sequence() {
    if (this.running) return; this.running = true;
    const tok = App.token, F = CONFIG.finale, door = $('#bigdoor');
    try {
      $('#door-acts').innerHTML = ''; door.classList.add('open'); Sound.play('door'); FX.twinkle();
      FX.burstAt(door, { n: 50, speed: 4, life: 90, cols: ['#ffffff', '#fff3c0', '#ffd9e6'] });
      await wait(2400); if (!this.alive(tok)) return;
      const compo = $('#compo'), links = $('#compo-links'), cap = $('#compo-cap'), orb = $('#compo-orb');
      await this.flash(() => { $$('.medal', compo).forEach(m => m.remove()); links.innerHTML = ''; cap.innerHTML = ''; orb.className = 'orbc'; this.phase('compo'); });
      if (!this.alive(tok)) return;
      const num = n => `<span class="num">${n}</span>`;
      const items = [
        { html: Art.ticketIcon(), cap: fill(F.items.ticket, { no: S.ticketNo }) },
        { html: num(S.wonders.found.length), cap: fill(F.items.wonders, { n: S.wonders.found.length }) },
        { html: Art.flower(S.garden.color), cap: F.items.flower },
        { html: Con.svg(false), cap: fill(F.items.con, { const: S.con.name || CONFIG.constellation.defaultName }) },
        { html: num(S.envelopes.length), cap: fill(F.items.envelopes, { n: S.envelopes.length }) },
        { html: num(S.secrets.length), cap: fill(F.items.secrets, { n: S.secrets.length }) }
      ];
      const pos = items.map((_, i) => { const a = (-90 + i * 60) * Math.PI / 180; return { x: 50 + 38 * Math.cos(a), y: 50 + 38 * Math.sin(a) }; });
      const setCap = async text => { const p = document.createElement('p'); p.className = 'rl'; p.textContent = text; cap.innerHTML = ''; cap.appendChild(p); await wait(40); p.classList.add('in'); };
      const link = (a, b) => { links.insertAdjacentHTML('beforeend', `<path class="lk" pathLength="1" d="M${pos[a].x.toFixed(2)} ${pos[a].y.toFixed(2)}L${pos[b].x.toFixed(2)} ${pos[b].y.toFixed(2)}"/>`); const l = links.lastElementChild; l.getBoundingClientRect(); l.classList.add('on'); };
      await wait(500);
      for (let i = 0; i < items.length; i++) {
        const m = document.createElement('div'); m.className = 'medal'; m.style.left = pos[i].x + '%'; m.style.top = pos[i].y + '%'; m.innerHTML = items[i].html;
        compo.appendChild(m); await wait(60); m.classList.add('on'); Sound.play('star');
        if (i) link(i - 1, i);
        FX.burstAt(m, { n: 16, cols: ['#fff3c0', '#ffd9e6', '#ffffff'] }); await setCap(items[i].cap);
        await wait(2300); if (!this.alive(tok)) return;
      }
      link(items.length - 1, 0); for (let i = 0; i < 3; i++) link(i, i + 3);
      await setCap(F.gather); Sound.play('found'); await wait(2600); if (!this.alive(tok)) return;
      $$('.medal', compo).forEach(m => m.classList.add('merge')); $$('.lk', links).forEach(l => l.classList.remove('on')); Sound.play('whoosh');
      await wait(1500); orb.classList.add('on'); cap.innerHTML = ''; FX.twinkle();
      await wait(2200); if (!this.alive(tok)) return;
      orb.classList.add('big'); Sound.play('bloom');
      await this.flash(() => { $('#reveal-lines').innerHTML = ''; $('#reveal-acts').innerHTML = ''; this.phase('reveal'); });
      if (!this.alive(tok)) return;
      FX.flies(14);
      const ok = await revealLines($('#reveal-lines'), F.reveal, { gap: 2000, accumulate: false, tapEl: $('#ph-reveal'), tok }); if (!ok) return;
      S.finale.revealed = true; Store.save();
      const b = mkBtn(F.letterButton, 'btn primary'); b.onclick = () => this.letter(); $('#reveal-acts').appendChild(b);
    } finally { this.running = false; }
  },
  /* большое письмо */
  letter() {
    const L = CONFIG.letter, F = CONFIG.finale, o = $('#letter');
    const personal = Object.values(L.personal || {}).filter(s => typeof s === 'string' && s.trim());
    const ps = L.paragraphs.concat(personal).map(p => para(fill(p))).join('');
    o.innerHTML = `<div class="paper" role="dialog" aria-modal="true"><h3>${esc(fill(L.greeting))}</h3>${ps}${para(fill(L.closing))}<p class="sign">${esc(fill(L.signature))}</p><div class="l-acts"></div></div>`;
    const acts = $('.l-acts', o);
    const more = mkBtn(F.moreButton, 'btn primary'); more.onclick = async () => { Sound.play('tap'); await UI.closeOverlay(o); if (App.current === 'last') this.hand(); };
    const cl = mkBtn(F.closeLetter, 'btn ghost small'); cl.onclick = () => { Sound.play('paper'); UI.closeOverlay(o); this.afterLetter(); };
    acts.append(more, cl);
    o.classList.remove('closing'); o.classList.add('on'); Sound.play('paper');
    o.onclick = e => { if (e.target === o) { UI.closeOverlay(o); this.afterLetter(); } };
  },
  afterLetter() {
    const acts = $('#reveal-acts'), F = CONFIG.finale;
    if (!$('#ph-reveal').classList.contains('on') || acts.childElementCount > 1) return;
    const b = mkBtn(F.moreButton, 'btn small'); b.onclick = () => this.hand(); acts.appendChild(b);
  },
  /* «передай телефон ему» */
  hand() {
    const H = CONFIG.finale.handover, el = $('#ph-hand'); UI.closeAll(); Sound.play('whoosh');
    el.innerHTML = `<div class="big-line">${esc(fill(H.title))}</div><p class="sub-line">${esc(fill(H.sub))}</p>`;
    const b = mkBtn(H.button, 'btn primary'); b.onclick = () => this.his(); el.appendChild(b);
    this.phase('hand');
  },
  /* скрытая сцена — только для него */
  his() {
    const Tn = CONFIG.finale.turn, H = CONFIG.his, el = $('#ph-his'); Sound.play('soft');
    el.innerHTML = `<div class="kicker">${esc(H.kicker)}</div><div class="big-line" style="margin-top:10px">${esc(fill(Tn.title))}</div><p class="sub-line">${esc(fill(Tn.sub))}</p>${UI.holdHTML('', use('s-star', 'class="seal" fill="#fff8ee"'))}`;
    UI.hold($('.hold', el), 1600, async () => {
      Sound.play('secret'); FX.burstAt($('.hold', el), { n: 40, speed: 4, cols: ['#ffd9e6', '#fff3c0', '#ffffff'] });
      await UI.card({ kicker: H.kicker, title: H.messageTitle, pages: [H.note, H.message], closeLabel: CONFIG.finale.finishButton, dismiss: false });
      if (App.current === 'last') this.end();
    });
    this.phase('his');
  },
  /* финал */
  async end() {
    const F = CONFIG.finale, el = $('#ph-end'), tok = App.token;
    S.finale.ended = true; Store.save();
    el.innerHTML = `<div class="end-map">${Con.svg(true)}</div><div class="names rl">${esc(fill(F.names))}</div><div class="final"></div><div class="ps"></div><button type="button" id="end-star" aria-label="…">${use('s-star', 'fill="#ffe3a3"')}</button>`;
    await this.flash(() => this.phase('end'));
    if (!this.alive(tok)) return;
    Con.animate(el); FX.flies(18); Sound.play('bloom');
    FX.form('heart', { y: FX.H * 0.34, size: Math.min(FX.W, FX.H) * 0.34, max: 0.45, n: 110, ms: 16000 });
    $('#end-star').onclick = () => {
      const ps = $('.ps', el); if (ps.firstChild) return;
      const p = document.createElement('span'); p.className = 'rl'; p.style.display = 'block'; p.textContent = fill(F.ps); ps.appendChild(p); void p.offsetWidth; p.classList.add('in');
      FX.burstAt($('#end-star'), { n: 20, cols: ['#fff3c0', '#ffffff'] }); Secret.find('ps', 1200);
    };
    await wait(3600); if (!this.alive(tok)) return;
    $('.names', el).classList.add('in');
    await revealLines($('.final', el), F.lastPhrase.split('\n'), { gap: 1500, tapEl: el, tok });
    if (!this.alive(tok)) return;
    FX.shower(6);
    const b = mkBtn(F.stayButton, 'btn small'); b.style.animation = 'fadeIn 1.6s ease both'; b.onclick = () => App.openMap(); el.appendChild(b);
  }
};

Scenes.aurora = {

    FX.stars(1, 0.03); FX.flies(4); document.body.classList.add('lit');
    FX.trailMode({ cols: ['#59f0c2', '#a8b8ff', '#f7a8d0', '#8ef0d6'], size: 30, life: 110, speed: 0.9, g: -0.004 });

    setTimeout(() => { if (tok === App.token) revealLines($('#a-text'), CONFIG.aurora.lines, { gap: 1700, tapEl: $('#a-pad'), tok }); }, 900);

/* ==========================================================================
   Запуск
   ========================================================================== */
function boot() {
  document.title = CONFIG.title;
  /* облака и «скорость» для экрана переезда */
  const clouds = (el, n) => { let h = ''; for (let i = 0; i < n; i++) h += `<i style="left:${(i * (100 / n) - 6 + rnd(-4, 4)).toFixed(1)}%;top:${rnd(8, 46).toFixed(1)}%;width:${rnd(28, 46).toFixed(1)}%;height:${rnd(46, 82).toFixed(1)}%;animation-delay:${(-rnd(0, 30)).toFixed(1)}s"></i>`; el.innerHTML = h; };
  clouds($('#cl1'), 6); clouds($('#cl2'), 7);
  let st = ''; for (let i = 0; i < 16; i++) st += `<i style="top:${rnd(4, 96).toFixed(1)}%;width:${rnd(60, 220).toFixed(0)}px;opacity:${rnd(0.2, 0.8).toFixed(2)};animation-duration:${rnd(0.7, 1.9).toFixed(2)}s;animation-delay:${(-rnd(0, 2)).toFixed(2)}s"></i>`;
  $('#streaks').innerHTML = st;

  /* станция: форма билета */
  $('#tf-title').textContent = CONFIG.intro.formTitle; $('#tf-sub').textContent = CONFIG.intro.formSub;
  $('#name-input').placeholder = CONFIG.intro.namePlaceholder; $('#btn-ticket').textContent = CONFIG.intro.ticketButton;
  $('#intro-tap').textContent = T.tapToContinue;
  $('#btn-ticket').onclick = () => Scenes.station.submit();
  $('#name-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); Scenes.station.submit(); } });
  $('#st-clock').addEventListener('click', () => Scenes.station.clock());

  /* HUD */
  $('#btn-back').onclick = () => { Sound.play('tap'); App.back(); };
  $('#btn-map').onclick = () => App.openMap();
  $('#btn-coll').onclick = () => App.openCollection();
  $('#btn-sound').onclick = () => { Sound.set(!Sound.on); Sound.play('found'); $('#sound-tip').classList.remove('on'); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') App.back(); });

  /* звук включается только после первого касания — и только если так решено */
  const wantSound = S.sound === true || (S.sound === null && CONFIG.sound.enabledByDefault);
  const first = e => {
    window.removeEventListener('pointerdown', first, true);
    if (wantSound && !Sound.on && !(e.target.closest && e.target.closest('#btn-sound'))) Sound.set(true, false);
  };
  window.addEventListener('pointerdown', first, true);

  /* редкие события: падающая звезда и награда за то, что просто остановилась посмотреть */
  window.addEventListener('pointerdown', () => { App.lastTouch = Date.now(); }, { passive: true, capture: true });
  setInterval(() => {
    if (document.hidden) return;
    if (Math.random() < 0.3) FX.shoot();
    if (S.introDone && ['wonders', 'garden'].includes(App.current) && !UI.anyOverlay() && !App.busy && Date.now() - App.lastTouch > 40000 && !Secret.has('idle')) { FX.shower(5); Secret.find('idle', 900); }
  }, 8000);

  /* клавиатура на телефоне не должна закрывать поле ввода */
  if (window.visualViewport) {
    const vv = window.visualViewport, app = $('#app');
    const fit = () => { const small = vv.height < window.innerHeight - 90; app.style.bottom = small ? 'auto' : ''; app.style.height = small ? vv.height + 'px' : ''; if (small) window.scrollTo(0, 0); };
    vv.addEventListener('resize', fit); vv.addEventListener('scroll', () => { if (vv.offsetTop) window.scrollTo(0, 0); });
  }

  /* любая непредвиденная ошибка не должна оставить девушку перед пустым экраном */
  let warned = false;
  const recover = () => {
    App.busy = false; $('#veil').classList.remove('on', 'white'); $('#travel').classList.remove('on', 'off'); $('#boot').classList.add('gone');
    if (!warned) { warned = true; UI.say(T.errorRecovered, 4000); setTimeout(() => { warned = false; }, 8000); }
  };
  window.addEventListener('error', recover); window.addEventListener('unhandledrejection', recover);

  /* продолжаем с того места, где остановились */
  const start = S.introDone && Scenes[S.scene] ? S.scene : 'station';
  App.go(start, { instant: true }).then(() => {
    setTimeout(() => $('#boot').classList.add('gone'), 250);
    if (S.introDone) setTimeout(() => UI.say(CONFIG.intro.welcomeBack, 4200), 1200);
  });
}

try { boot(); } catch (e) {
  console.error(e);
  const b = document.getElementById('boot'); if (b) b.classList.add('gone');
}

/* для отладки из консоли: OLU.state(), OLU.config */
window.OLU = { config: CONFIG, state: () => JSON.parse(JSON.stringify(S)), go: s => App.go(s), fx: FX };
})();
