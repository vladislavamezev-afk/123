<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<meta name="robots" content="noindex, nofollow">
<title>Our Little Universe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b1030'/%3E%3Cpath d='M50 14 58 42 86 50 58 58 50 86 42 58 14 50 42 42Z' fill='%23ffe3a3'/%3E%3C/svg%3E">
<style>
/* ============================================================
   OUR LITTLE UNIVERSE — стили
   Палитра: розовый, лавандовый, молочный, небесный, ночной синий
   ============================================================ */
:root{
  --rose:#f7b9d0; --rose-deep:#e98bb0; --lav:#b9a7f0; --lav-deep:#8a74d6;
  --milk:#fff6ee; --sky:#a9d4ff; --night:#0b1030; --night2:#1a1846; --gold:#ffe3a3;
  --ink:#f4eefc; --ink-soft:rgba(244,238,252,.72);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Serif",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.26,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--night);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input{font:inherit;-webkit-user-select:text;user-select:text}
svg{display:block;overflow:visible}
[hidden]{display:none!important}

/* ---------- фон: градиенты станций и облака ---------- */
#backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;background:#060818}
.bd{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease}
.bd-station{background:linear-gradient(180deg,#070a22 0%,#151644 34%,#3a2d6e 62%,#8a5f9e 84%,#e9a9c4 100%)}
.bd-wonders{background:linear-gradient(180deg,#141340 0%,#3b3180 30%,#7d67bd 58%,#c9a2d8 80%,#f8cfe0 100%)}
.bd-garden{background:linear-gradient(180deg,#0b1535 0%,#1f3672 34%,#5b6fc4 62%,#a9b7ee 84%,#e4dcff 100%)}
.bd-sky{background:radial-gradient(120% 80% at 50% 110%,#3a2a78 0%,#141646 42%,#060818 78%)}
.bd-last{background:linear-gradient(180deg,#07081f 0%,#1d1548 36%,#57387c 64%,#b97a9c 86%,#ffd7c4 100%)}
.bd-aurora{background:linear-gradient(180deg,#040a1c 0%,#0b2440 45%,#184a5c 78%,#3c7a78 100%)}
body[data-scene="station"] .bd-station,body[data-scene="wonders"] .bd-wonders,body[data-scene="garden"] .bd-garden,
body[data-scene="sky"] .bd-sky,body[data-scene="last"] .bd-last,body[data-scene="aurora"] .bd-aurora{opacity:1}
.cloud-layer{position:absolute;left:-20%;width:140%;height:46%;bottom:-6%;opacity:.0;transition:opacity 2.4s ease;
  transform:translate3d(calc(var(--px,0)*1px),calc(var(--py,0)*1px),0);will-change:transform}
body.lit .cloud-layer{opacity:.85}
body[data-scene="sky"] .cloud-layer,body[data-scene="aurora"] .cloud-layer{opacity:.18}
.cloud-layer.l2{bottom:-14%;height:40%}
.cloud-layer i{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,246,238,.75),rgba(255,214,232,.32) 55%,rgba(255,255,255,0) 100%);
  filter:blur(6px);animation:drift 46s ease-in-out infinite alternate}
.cloud-layer.l2 i{background:radial-gradient(closest-side,rgba(255,255,255,.92),rgba(226,214,255,.42) 55%,rgba(255,255,255,0) 100%);animation-duration:34s}
@keyframes drift{from{transform:translateX(-3%)}to{transform:translateX(4%)}}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#fx-stars{z-index:1} #fx-top{z-index:50}

/* ---------- сцены ---------- */
#app{position:fixed;inset:0;z-index:2}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.active{display:block}
.stage{position:relative;width:min(100%,760px);height:100%;margin:0 auto}
.h-serif{font-family:var(--serif);font-weight:400;letter-spacing:.01em}
.kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft)}
.scene-title{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 64px);text-align:center;pointer-events:none;padding:0 20px;
  animation:fadeUp 1.6s var(--ease) both}
.scene-title h2{font-family:var(--serif);font-weight:400;font-size:clamp(24px,6.4vw,36px);font-style:italic;
  text-shadow:0 0 28px rgba(255,214,232,.55)}
.scene-title p{margin-top:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* строки, появляющиеся по одной */
.rl{opacity:0;transform:translateY(12px);filter:blur(8px);transition:opacity 1.5s ease,transform 1.5s var(--ease),filter 1.5s ease}
.rl.in{opacity:1;transform:none;filter:none}
.rl.out{opacity:0;transform:translateY(-10px);filter:blur(8px)}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 28px;border-radius:999px;
  font-size:16px;letter-spacing:.02em;color:var(--ink);background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .25s var(--ease),box-shadow .4s ease,background .3s ease,opacity .4s ease}
.btn:active{transform:scale(.96)}
.btn.primary{color:#2a1d4d;font-weight:600;border-color:rgba(255,255,255,.7);
  background:linear-gradient(120deg,#ffd9e6 0%,#f7b9d0 38%,#cdbcf7 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 8px 34px rgba(247,185,208,.45),0 0 60px rgba(185,167,240,.35);
  animation:btnGlow 3.2s ease-in-out infinite}
@keyframes btnGlow{50%{box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 8px 44px rgba(247,185,208,.7),0 0 80px rgba(185,167,240,.55)}}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.22);color:var(--ink-soft);min-height:46px;padding:10px 22px;font-size:14px}
.btn.small{min-height:44px;padding:10px 20px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-t) + 10px) 12px 10px;pointer-events:none}
#hud>*{pointer-events:auto}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(16,18,56,.42);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .2s var(--ease),background .3s,opacity .5s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#hud-chip{margin:0 auto;padding:8px 14px;border-radius:999px;font-size:13px;letter-spacing:.03em;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  background:rgba(16,18,56,.42);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .5s,transform .5s var(--ease)}
#hud-chip:empty{opacity:0;transform:translateY(-8px)}
#hud-chip b{color:var(--gold);font-weight:600}
#hud.intro #btn-back,#hud.intro #btn-map,#hud.intro #btn-coll{opacity:0;pointer-events:none}
@media (max-width:359px){#hud{gap:6px;padding-left:8px;padding-right:8px}.icon-btn{width:42px;height:42px}#hud-chip{font-size:12px;padding:7px 10px}}
#btn-sound .wave{transition:opacity .3s} #btn-sound.off .wave{opacity:0} #btn-sound .cross{opacity:0;transition:opacity .3s} #btn-sound.off .cross{opacity:1}
#btn-back[disabled]{opacity:.3;pointer-events:none}
.sound-tip{position:fixed;top:calc(var(--safe-t) + 64px);right:12px;z-index:21;font-size:12px;padding:7px 12px;border-radius:12px;
  background:rgba(16,18,56,.6);border:1px solid rgba(255,255,255,.2);color:var(--ink-soft);opacity:0;transition:opacity .8s;pointer-events:none}
.sound-tip.on{opacity:1}

/* ---------- всплывающие подсказки ---------- */
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 68px);z-index:60;width:max-content;transform:translate(-50%,-16px);opacity:0;pointer-events:none;
  max-width:min(88vw,460px);padding:13px 20px;border-radius:18px;text-align:center;font-size:14.5px;line-height:1.45;
  background:rgba(20,20,62,.82);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 40px rgba(5,6,30,.5);transition:opacity .5s ease,transform .5s var(--ease)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.secret{border-color:rgba(255,227,163,.7);box-shadow:0 0 44px rgba(255,227,163,.35),0 12px 40px rgba(5,6,30,.5)}
#toast.secret b{display:block;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:3px;font-weight:500}

/* ---------- переходы ---------- */
#veil{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 60%,#1c1a52,#060818 75%);opacity:0;pointer-events:none;transition:opacity .65s ease}
#veil.on{opacity:1;pointer-events:auto}
#veil.white{background:radial-gradient(circle at 50% 55%,#fffaf2,#f6d7e6 60%,#cdbcf7)}
#travel{position:fixed;inset:0;z-index:80;display:none;overflow:hidden;background:linear-gradient(180deg,#070a22,#1c1a52 60%,#4a3a86)}
#travel.on{display:block;animation:fadeIn .7s ease both}
#travel.off{animation:fadeOutK .7s ease both}
@keyframes fadeOutK{to{opacity:0}}
#travel .streaks i{position:absolute;height:1.5px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  animation:streak linear infinite}
@keyframes streak{from{transform:translateX(110vw)}to{transform:translateX(-140vw)}}
#travel .t-train{position:absolute;left:50%;top:52%;width:min(84vw,520px);transform:translate(-50%,-50%);animation:bob 1.1s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 22px rgba(255,227,163,.35))}
@keyframes bob{from{margin-top:-2px}to{margin-top:3px}}
#travel .t-rail{position:absolute;left:0;right:0;top:calc(52% + min(11vw,68px));height:2px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0 26px,transparent 26px 44px);animation:rail .5s linear infinite;opacity:.6}
@keyframes rail{to{background-position:-44px 0}}
#travel .t-text{position:absolute;left:0;right:0;top:20%;text-align:center;padding:0 24px}
#travel .t-text .kicker{animation:fadeUp 1.2s .3s var(--ease) both}
#travel .t-text h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(26px,7vw,40px);margin-top:10px;animation:fadeUp 1.4s .8s var(--ease) both;
  text-shadow:0 0 30px rgba(255,214,232,.6)}
#travel .t-text p{margin-top:6px;color:var(--ink-soft);animation:fadeUp 1.4s 1.3s var(--ease) both}
#boot{position:fixed;inset:0;z-index:90;background:#060818;display:grid;place-items:center;transition:opacity 1s ease}
#boot.gone{opacity:0;pointer-events:none}
.orbit{width:54px;height:54px;position:relative}
.orbit::before,.orbit::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.orbit::after{inset:auto;left:50%;top:-4px;width:8px;height:8px;margin-left:-4px;border:0;background:var(--gold);box-shadow:0 0 16px 4px rgba(255,227,163,.7);
  transform-origin:4px 31px;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.noscript{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#060818;color:#fff;text-align:center;padding:30px}

/* ---------- оверлеи: карточки, панели ---------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 18px);
  background:rgba(6,8,30,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.overlay.on{display:flex;animation:fadeIn .45s ease both}
.overlay.closing{animation:fadeOutK .35s ease both}
#panel{z-index:30} #modal{z-index:40} #letter{z-index:42} #envelope{z-index:45}
.card{position:relative;width:min(100%,440px);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:28px;padding:26px 24px 22px;text-align:center;
  background:linear-gradient(165deg,rgba(60,50,128,.92),rgba(28,26,82,.94));border:1px solid rgba(255,255,255,.24);
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 30px 80px rgba(4,4,24,.6),0 0 70px rgba(185,167,240,.25);
  animation:cardIn .6s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.card-art{width:112px;height:112px;margin:0 auto 10px;filter:drop-shadow(0 0 20px rgba(255,227,163,.45))}
.card-art svg{width:100%;height:100%}
.card h3{font-family:var(--serif);font-weight:400;font-style:italic;font-size:24px;line-height:1.25;margin:6px 0 12px;text-shadow:0 0 24px rgba(255,214,232,.4)}
.card-body{font-size:16.5px;line-height:1.62;color:#efe8fb;min-height:60px;transition:opacity .35s ease}
.card-body.swap{opacity:0}
.card-body p+p{margin-top:.7em}
.card-actions{margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:center}
.card-dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.card-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .3s,transform .3s}
.card-dots i.on{background:var(--gold);transform:scale(1.3)}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.choice{min-height:50px;padding:12px 16px;border-radius:16px;text-align:left;font-size:15.5px;line-height:1.35;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);transition:background .3s,border-color .3s,transform .2s var(--ease)}
.choice:active{transform:scale(.98)}
.choice.wrong{animation:shake .5s;border-color:rgba(247,185,208,.6)}
.choice.right{background:rgba(255,227,163,.22);border-color:var(--gold)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mirror-text{transform:scaleX(-1);filter:blur(5px);opacity:.55;transition:transform 1.6s var(--ease),filter 1.6s ease,opacity 1.6s ease}
.mirror-text.clear{transform:none;filter:none;opacity:1}
.field{width:100%;min-height:52px;padding:12px 18px;border-radius:16px;font-size:17px;color:var(--ink);text-align:center;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);outline:0;transition:border-color .3s,box-shadow .3s}
.field::placeholder{color:rgba(244,238,252,.45)}
.field:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(247,185,208,.18)}
.field.bad{animation:shake .5s;border-color:var(--rose-deep)}

/* кнопка «удерживай» */
.hold{position:relative;width:112px;height:112px;border-radius:50%;display:grid;place-items:center;margin:0 auto;
  background:radial-gradient(circle at 35% 30%,#ffe9f1,#f1a6c4 55%,#b780d9);box-shadow:0 0 50px rgba(247,185,208,.6),0 10px 30px rgba(4,4,24,.5);
  transition:transform .3s var(--ease)}
.hold.pressing{transform:scale(.93)}
.hold svg.ring{position:absolute;inset:-10px;width:132px;height:132px;transform:rotate(-90deg)}
.hold svg.ring circle{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;stroke-dasharray:390;stroke-dashoffset:390}
.hold.pressing svg.ring circle{transition:stroke-dashoffset var(--hold-ms,1600ms) linear;stroke-dashoffset:0}
.hold .seal{width:48px;height:48px}
.hold.danger{background:radial-gradient(circle at 35% 30%,#fff,#e9c9d6 55%,#9d8bc9);width:92px;height:92px}
.hold.danger svg.ring{inset:-8px;width:108px;height:108px}

/* ---------- панель: карта маршрута и коллекция ---------- */
.sheet{position:relative;width:min(100%,460px);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:28px;padding:22px 20px 20px;
  background:linear-gradient(170deg,rgba(40,36,104,.95),rgba(16,16,56,.96));border:1px solid rgba(255,255,255,.22);
  box-shadow:0 30px 80px rgba(4,4,24,.6);animation:cardIn .5s var(--ease) both}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:24px}
.route{position:relative;padding-left:8px}
.route::before{content:"";position:absolute;left:29px;top:26px;bottom:26px;width:2px;background:repeating-linear-gradient(180deg,rgba(255,255,255,.45) 0 6px,transparent 6px 12px)}
.stop{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 10px 10px 0;border-radius:18px;min-height:64px;transition:background .3s}
.stop:active{background:rgba(255,255,255,.07)}
.stop .dot{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#231f62;border:1.5px solid rgba(255,255,255,.4);position:relative;z-index:1}
.stop .dot svg{width:20px;height:20px}
.stop.done .dot{background:linear-gradient(140deg,#f7b9d0,#b9a7f0);border-color:#fff}
.stop.here .dot{box-shadow:0 0 0 5px rgba(255,227,163,.22),0 0 26px rgba(255,227,163,.6);border-color:var(--gold)}
.stop.locked{opacity:.42;pointer-events:none}
.stop .nm{font-family:var(--serif);font-size:18px;line-height:1.2}
.stop .ru{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.stop.secret-stop .dot{background:linear-gradient(140deg,#ffe3a3,#f7b9d0)}
.sheet-foot{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:center;gap:10px}
.map-train{width:74px;opacity:.85;padding:8px 0;transition:transform 2.2s var(--ease)}
.map-train.run{transform:translateX(150px)}
.coll-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.coll{position:relative;border-radius:20px;padding:14px 12px;min-height:118px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);transition:background .3s,transform .2s var(--ease)}
.coll:active{transform:scale(.97)}
.coll.wide{grid-column:1/-1}
.coll.empty{opacity:.45;pointer-events:none}
.coll .ic{width:54px;height:54px} .coll .ic svg{width:100%;height:100%}
.coll .nm{font-size:14px;line-height:1.25} .coll .sub{font-size:12px;color:var(--ink-soft)}
.list{display:flex;flex-direction:column;gap:8px;text-align:left}
.list button,.list div.row{display:flex;gap:12px;align-items:center;min-height:52px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);text-align:left;font-size:15px}
.list .row.dim{opacity:.4}
.list .mini{flex:none;width:30px;height:30px}

/* ---------- билет ---------- */
.ticket-slot{position:relative;width:min(92%,360px);margin:0 auto;overflow:hidden;padding-top:6px}
.ticket-slot::before{content:"";position:absolute;top:0;left:6%;right:6%;height:6px;border-radius:6px;background:rgba(10,10,40,.8);box-shadow:0 0 18px rgba(255,227,163,.5);z-index:2}
.ticket{position:relative;display:flex;color:#3a2a5c;border-radius:16px;filter:drop-shadow(0 16px 30px rgba(4,4,24,.5));text-align:left;
  background:linear-gradient(135deg,#fff8f0 0%,#ffe7f0 50%,#e8defd 100%);
  -webkit-mask:radial-gradient(circle 9px at 72% 0,transparent 98%,#000) top,radial-gradient(circle 9px at 72% 100%,transparent 98%,#000) bottom;
  -webkit-mask-size:100% 51%;-webkit-mask-repeat:no-repeat;mask:radial-gradient(circle 9px at 72% 0,transparent 98%,#000) top,radial-gradient(circle 9px at 72% 100%,transparent 98%,#000) bottom;mask-size:100% 51%;mask-repeat:no-repeat}
.ticket.print{animation:print 2.4s cubic-bezier(.3,.1,.3,1) both}
@keyframes print{0%{transform:translateY(-104%)}18%{transform:translateY(-78%)}30%{transform:translateY(-78%)}52%{transform:translateY(-40%)}62%{transform:translateY(-40%)}100%{transform:none}}
.t-main{flex:0 0 72%;padding:16px 14px 14px 18px;border-right:2px dashed rgba(90,60,130,.3)}
.t-stub{flex:1;padding:14px 8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:8px}
.t-kicker{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:#8c6fb3}
.t-name{font-family:var(--serif);font-style:italic;font-size:clamp(24px,7vw,30px);line-height:1.15;margin:6px 0 10px;color:#3a2261;word-break:break-word;
  background:linear-gradient(100deg,#7a4fc0,#d9689b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.t-row{display:flex;gap:10px;margin-top:6px}
.t-row div{flex:1;font-size:12.5px;line-height:1.3;font-weight:600}
.t-row span{display:block;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:#a58bc4;font-weight:500}
.t-no{writing-mode:vertical-rl;font-size:11px;letter-spacing:.16em;color:#6b4c96;font-weight:600}
.t-bars{width:80%;height:26px;background:repeating-linear-gradient(90deg,#3a2a5c 0 2px,transparent 2px 4px,#3a2a5c 4px 5px,transparent 5px 9px,#3a2a5c 9px 12px,transparent 12px 14px)}
.t-star{width:22px;height:22px}
.flip{perspective:900px;width:100%}
.flip-in{position:relative;transition:transform .9s var(--ease);transform-style:preserve-3d}
.flip.turned .flip-in{transform:rotateY(180deg)}
.flip .face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{position:absolute;inset:0;transform:rotateY(180deg);border-radius:16px;display:grid;place-items:center;padding:18px;text-align:center;color:#3a2a5c;
  font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.45;background:linear-gradient(135deg,#e8defd,#ffe7f0)}

/* ---------- СТАНЦИЯ 00:00 ---------- */
#sc-station .art{position:absolute;left:0;right:0;bottom:0;height:52%;opacity:0;transform:translateY(30px);transition:opacity 3s ease,transform 3.4s var(--ease)}
#sc-station.s-art .art{opacity:1;transform:none}
#sc-station .art svg{width:100%;height:100%}
#intro-lines{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 13%);padding:0 28px;text-align:center;transition:opacity 1s ease}
#intro-lines p{font-family:var(--serif);font-size:clamp(19px,5.2vw,25px);line-height:1.45;margin-bottom:.75em;text-shadow:0 0 26px rgba(255,214,232,.4)}
#intro-lines p:last-child{font-style:italic;color:#ffe9f1}
#sc-station.s-form #intro-lines,#sc-station.s-ticket #intro-lines,#sc-station.s-revisit #intro-lines{opacity:0;pointer-events:none}
.station-ui{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 74px);padding:0 22px;text-align:center;display:none}
#sc-station.s-form #ticket-form,#sc-station.s-ticket #ticket-view,#sc-station.s-revisit #ticket-view{display:block;animation:fadeUp 1.2s var(--ease) both}
#ticket-form h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:26px;margin:6px 0 4px}
#ticket-form p{color:var(--ink-soft);font-size:14.5px;margin-bottom:16px}
#ticket-form .field{max-width:320px;margin-bottom:14px}
#ticket-view .btn{margin-top:20px}
#ticket-view .after{opacity:0;animation:fadeUp 1s 2.5s var(--ease) both}
#sc-station.s-revisit #ticket-view .after{animation-delay:.2s}
.tap-hint{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 14px);text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);
  opacity:0;transition:opacity 1s;pointer-events:none}
.tap-hint.on{opacity:1;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.lamp-halo{animation:halo 3.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes halo{50%{opacity:.55;transform:scale(1.12)}}
.far-train{transition:transform 3.2s cubic-bezier(.6,0,.9,.4),opacity 3s ease}
#sc-station.s-depart .far-train{transform:translateX(420px);opacity:0}
.st-clock{cursor:pointer}
.st-clock .hand{transform-origin:300px 150px;transition:transform 1.6s var(--ease)}
.st-clock.spin .hand.m{transform:rotate(1080deg)} .st-clock.spin .hand.h{transform:rotate(360deg)}
.win{animation:winGlow 4s ease-in-out infinite} @keyframes winGlow{50%{opacity:.7}}

/* ---------- МАЛЕНЬКИЕ ЧУДЕСА ---------- */
#sc-wonders .scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#sc-wonders .scroller::-webkit-scrollbar{display:none}
.world{position:relative;width:min(100%,760px);margin:0 auto;height:2620px}
.w-layer{position:absolute;inset:0;pointer-events:none;will-change:transform}
.puff{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,224,238,.4) 60%,rgba(255,255,255,0));filter:blur(3px)}
.puff.dim{opacity:.4;filter:blur(8px)}
.w-head{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 78px);text-align:center;padding:0 24px}
.w-head h2{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(28px,7.4vw,40px);text-shadow:0 0 30px rgba(255,214,232,.6)}
.w-head p{color:var(--ink-soft);margin-top:8px;font-size:15px;max-width:320px;margin-inline:auto}
.scroll-cue{margin:18px auto 0;width:22px;height:34px;border-radius:12px;border:1.5px solid rgba(255,255,255,.5);position:relative}
.scroll-cue::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{60%{transform:translateY(12px);opacity:0}100%{opacity:0}}
.wonder{position:absolute;transform:translate(-50%,-50%);display:block;border-radius:50%;padding:0}
.wonder svg{width:100%;height:100%;pointer-events:none}
.wonder .gl{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,236,200,.5),rgba(255,214,232,.18) 55%,transparent);
  animation:breathe 3.4s ease-in-out infinite;pointer-events:none}
.wonder.found .gl{animation-duration:6s;opacity:.5}
@keyframes breathe{50%{transform:scale(1.18);opacity:.55}}
.wonder .fl{display:block;width:100%;height:100%;animation:floaty 5s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
.wonder:nth-of-type(2n) .fl{animation-duration:6.4s} .wonder:nth-of-type(3n) .fl{animation-duration:4.4s;animation-delay:-2s}
.wonder.tapped .fl{animation:tapPop .5s var(--ease)}
@keyframes tapPop{40%{transform:scale(1.14)}100%{transform:scale(1)}}
.wonder.nope .fl{animation:shake .5s}
.caption{position:absolute;left:50%;top:100%;transform:translateX(-50%);white-space:nowrap;font-size:12px;letter-spacing:.06em;color:var(--ink);
  padding:4px 10px;border-radius:10px;background:rgba(16,18,56,.55);opacity:0;transition:opacity .4s;pointer-events:none}
.caption.on{opacity:1}
/* звезда */
#w-star .rays{transform-origin:50px 50px;animation:spin 30s linear infinite;opacity:.7}
#w-star.go .rays{animation:rayBurst 1s var(--ease)} @keyframes rayBurst{40%{transform:scale(1.8) rotate(40deg);opacity:1}100%{transform:scale(1) rotate(90deg)}}
#w-star .core{transform-origin:50px 50px;animation:twk 2.6s ease-in-out infinite} @keyframes twk{50%{transform:scale(.9)}}
/* луна */
#w-moon .shadow{transition:transform 2.4s var(--ease)} #w-moon.full .shadow{transform:translateX(64px)}
/* облако */
#w-cloud .c1,#w-cloud .c2{transition:opacity 1s ease,transform 1.3s var(--ease);transform-origin:50px 50px}
#w-cloud .c2{opacity:0;transform:scale(.3)} #w-cloud.heart .c1{opacity:0;transform:scale(.6)} #w-cloud.heart .c2{opacity:1;transform:scale(1)}
/* банка */
#w-jar .lid{transition:transform .9s var(--ease);transform-origin:50px 22px} #w-jar.open .lid{transform:translate(18px,-20px) rotate(28deg)}
#w-jar .ff{animation:ff 2.8s ease-in-out infinite alternate} #w-jar .ff:nth-child(2){animation-duration:3.6s;animation-delay:-1s} #w-jar .ff:nth-child(3){animation-duration:2.2s;animation-delay:-.6s}
@keyframes ff{from{transform:translate(-5px,5px)}to{transform:translate(6px,-9px)}}
#w-jar.open .ff{opacity:.25;transition:opacity 1.2s}
/* ключ */
#w-key .fl{animation:keyTurn 6s ease-in-out infinite alternate} @keyframes keyTurn{from{transform:rotate(-14deg) translateY(-4px)}to{transform:rotate(12deg) translateY(5px)}}
#w-key.go .fl{animation:keyGo 1.3s var(--ease) both} @keyframes keyGo{50%{transform:rotate(360deg) scale(1.25)}100%{transform:rotate(720deg) scale(0);opacity:0}}
/* коробка */
#w-box .lidb{transition:transform .8s var(--ease);transform-origin:20px 44px} #w-box.open .lidb{transform:rotate(-58deg) translate(-4px,-6px)}
#w-box .lantern{opacity:0;transform:translateY(10px) scale(.4);transform-origin:50px 50px;transition:transform 3.4s var(--ease),opacity 1s} #w-box.open .lantern{opacity:1;transform:translateY(-58px) scale(1)}
#w-box.rattle .fl{animation:rattle .6s} @keyframes rattle{15%{transform:rotate(-7deg)}35%{transform:rotate(7deg) translateY(-4px)}55%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}}
/* бабочка */
#w-butterfly{left:0;top:0;transform:none;will-change:transform;z-index:3}
#w-butterfly .wingL,#w-butterfly .wingR{transform-origin:50px 50px;animation:flap .32s ease-in-out infinite alternate} #w-butterfly .wingR{animation-name:flapR}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}} @keyframes flapR{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
#w-butterfly.rest .wingL,#w-butterfly.rest .wingR{animation-duration:1.5s}
/* колокольчик */
#w-bell .sw{transform-origin:50px 12px} #w-bell.ring .sw{animation:swing 1.5s ease-out} @keyframes swing{12%{transform:rotate(22deg)}30%{transform:rotate(-17deg)}48%{transform:rotate(12deg)}66%{transform:rotate(-7deg)}84%{transform:rotate(3deg)}}
.ringwave{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:1.5px solid rgba(255,227,163,.9);pointer-events:none;animation:ringw 1.6s ease-out forwards}
@keyframes ringw{to{transform:scale(11);opacity:0}}
/* кристалл */
#w-crystal .fac{animation:facet 4s ease-in-out infinite alternate} #w-crystal .fac:nth-child(2){animation-delay:-1.3s} #w-crystal .fac:nth-child(3){animation-delay:-2.6s}
@keyframes facet{from{opacity:.55}to{opacity:1}}
#w-crystal.solved svg{animation:hue 5s linear infinite} @keyframes hue{to{filter:hue-rotate(360deg)}}
/* зеркало */
#w-mirror .shine{animation:shine 4.5s ease-in-out infinite} @keyframes shine{0%,55%{transform:translateX(-46px)}100%{transform:translateX(46px)}}
/* дверь */
#w-door .leaf{transform-origin:28px 60px;transition:transform 2s var(--ease)} #w-door.open .leaf{transform:scaleX(.12) skewY(-8deg)}
#w-door .light{opacity:0;transition:opacity 2s} #w-door.open .light{opacity:1}
#w-door .rune{fill:rgba(255,255,255,.22);transition:fill .6s} #w-door .rune.on{fill:var(--gold);filter:drop-shadow(0 0 4px #ffe3a3)}
/* тайные объекты */
.hid{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.hid i{display:block;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.7);opacity:.28;animation:shy 7s ease-in-out infinite}
@keyframes shy{0%,82%,100%{opacity:.16;transform:scale(1)}90%{opacity:.95;transform:scale(1.7)}}
.hid.got i{opacity:1;animation:none;background:var(--gold);box-shadow:0 0 14px 4px rgba(255,227,163,.8)}
#h-spark{opacity:0;pointer-events:none;transition:opacity 2s} #h-spark.live{opacity:1;pointer-events:auto} #h-spark i{background:#ffc2d9;box-shadow:0 0 10px 3px rgba(255,170,205,.8);animation-duration:4s}
#h-grass{width:auto;height:44px;padding:0 16px;border-radius:14px;font-family:var(--serif);font-style:italic;font-size:12px;color:rgba(255,255,255,.3);letter-spacing:.08em;transition:color 1s}
#h-grass.got{color:var(--gold)}
.w-next{position:absolute;left:0;right:0;bottom:120px;text-align:center;padding:0 24px}
.w-next p{font-size:14px;color:#4b3a78;margin-top:10px}
.w-next .btn[disabled]{background:rgba(40,30,90,.35);color:#fff;animation:none;box-shadow:none;border-color:rgba(255,255,255,.3);opacity:.8}
#w-dock{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 18px);text-align:center;z-index:5;pointer-events:none;opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s var(--ease)}
#w-dock.on{opacity:1;transform:none} #w-dock.on .btn{pointer-events:auto}

/* тайная комната */
.room{position:absolute;inset:0;z-index:8;display:none;background:linear-gradient(180deg,#0d0b26,#1c1740 60%,#2a2152)}
.room.on{display:block;animation:fadeIn 1s ease both}
.room svg.rm{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 60px);bottom:96px;width:100%;height:calc(100% - var(--safe-t) - 156px)}
.room .dark{transition:opacity 1.6s ease} .room.lit .dark{opacity:0}
.room .lampglow{opacity:0;transition:opacity 1.6s ease} .room.lit .lampglow{opacity:1}
.room .wallnote{opacity:0;transition:opacity 2.4s .6s ease} .room.lit .wallnote{opacity:1}
.room .tapme{cursor:pointer}
.room-foot{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 22px);text-align:center}
.room-hint{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 70px);text-align:center;font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink-soft);padding:0 30px;z-index:2}

/* ---------- САД ---------- */
#sc-garden .g-svg{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 150px);bottom:calc(var(--safe-b) + 84px)}
#sc-garden .g-svg svg{width:100%;height:100%}
#g-phrase{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 66px);height:92px;padding:0 26px;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#g-phrase p{font-family:var(--serif);font-style:italic;font-size:clamp(18px,5vw,23px);line-height:1.35;text-shadow:0 0 24px rgba(20,20,80,.8),0 0 30px rgba(255,214,232,.5)}
#g-hint{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 18px);padding:0 22px;text-align:center;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px}
#g-hint .txt{font-size:14.5px;color:#fff;padding:9px 16px;border-radius:14px;background:rgba(16,18,56,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);transition:opacity .5s}
#g-colors{position:absolute;left:0;right:0;top:calc(var(--safe-t) + 168px);display:none;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 16px;z-index:3}
#g-colors.on{display:flex}
.orb{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.75);box-shadow:0 0 26px var(--c),inset 0 -8px 14px rgba(0,0,0,.14),inset 0 8px 12px rgba(255,255,255,.5);background:var(--c);
  animation:orbIn .8s var(--ease) both,floaty 4s ease-in-out infinite alternate;transition:transform .3s var(--ease)}
.orb:nth-child(2){animation-delay:.1s,-1s}.orb:nth-child(3){animation-delay:.2s,-2s}.orb:nth-child(4){animation-delay:.3s,-.5s}.orb:nth-child(5){animation-delay:.4s,-1.6s}
.orb:active{transform:scale(1.15)}
@keyframes orbIn{from{opacity:0;transform:scale(.2)}}
.g-tap{cursor:pointer}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite alternate}
.sway.s2{animation-duration:6.5s;animation-delay:-2s} .sway.s3{animation-duration:4.2s;animation-delay:-1s}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3.5deg)}}
.rustle{animation:rustle .7s ease!important} @keyframes rustle{20%{transform:rotate(-9deg) scale(1.05)}45%{transform:rotate(8deg)}70%{transform:rotate(-5deg)}}
.glint{animation:glint 3.4s ease-in-out infinite} @keyframes glint{0%,70%,100%{opacity:0}82%{opacity:1}}
#g-seed{opacity:0;transition:opacity .8s,transform 1.6s var(--ease)} #g-seed.show{opacity:1} #g-seed.planted{transform:translate(var(--sx),var(--sy))}
#g-seed.gone{opacity:0}
#g-stem{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2s var(--ease)}
.gleaf{transform-box:fill-box;transform:scale(0);transition:transform 1.6s var(--ease)} .gleaf.on{transform:scale(1)}
.gleaf.l{transform-origin:100% 100%} .gleaf.r{transform-origin:0 100%}
#g-plant.touch{animation:plantSway 1.2s var(--ease)} #g-plant{transform-origin:200px 452px}
@keyframes plantSway{25%{transform:rotate(5deg)}55%{transform:rotate(-4deg)}80%{transform:rotate(2deg)}}
#g-head{opacity:0;transition:opacity 1.4s} #g-head.on{opacity:1}
.petal{transform-origin:0 0;transform:scale(0);transition:transform 2.6s var(--ease)}
.bloom .petal{transform:scale(1)} .bloom .petal.in{transform:scale(.62)}
.sepal{transition:opacity 1.6s,transform 2s var(--ease);transform-origin:0 0} .bloom .sepal{opacity:0;transform:scale(.4)}
.fcore{transform-origin:0 0;transform:scale(0);transition:transform 1.6s 1.4s var(--ease)} .bloom .fcore{transform:scale(1)}
#g-budglow{transform-box:fill-box;transform-origin:center;opacity:0;transition:opacity 1s}

.mote{opacity:0;pointer-events:none;transition:transform 1.5s var(--ease),opacity .6s}
[data-step="5"] .mote{opacity:1;pointer-events:auto} [data-step="5"] .mote.got,.mote.got{opacity:0;pointer-events:none}
.mote .m{animation:shy 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#g-bucket{transition:transform 1.8s var(--ease)} .well-up #g-bucket{transform:translateY(-34px)}
#g-wellglow{animation:halo 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center} .watered #g-wellglow{opacity:.35}
#g-can{transition:transform 1.3s var(--ease);transform-origin:95px 440px} #g-can.pour{transform:translate(52px,-74px) rotate(32deg)}
#g-can .fill{opacity:0;transition:opacity 1s} #g-can.full .fill{opacity:1}
#g-drops{opacity:0} #g-drops.on{opacity:1}
#g-drops circle{animation:drop .7s linear infinite} #g-drops circle:nth-child(2){animation-delay:-.2s}#g-drops circle:nth-child(3){animation-delay:-.4s}#g-drops circle:nth-child(4){animation-delay:-.55s}
@keyframes drop{from{transform:translate(0,0);opacity:1}to{transform:translate(-6px,58px);opacity:0}}
#g-mush{transform-box:fill-box;transform-origin:50% 100%} #g-mush.boing{animation:boing .7s var(--ease)} @keyframes boing{30%{transform:scale(1.15,.8)}60%{transform:scale(.92,1.14)}}
#g-menv{opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s var(--ease);pointer-events:none} #g-menv.on{opacity:1;transform:none;pointer-events:auto}
#g-lantern .lg{animation:halo 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

/* ---------- СОЗВЕЗДИЕ ---------- */
#sc-sky .stage{display:flex;flex-direction:column;padding:calc(var(--safe-t) + 62px) 16px calc(var(--safe-b) + 14px)}
#sky-mapwrap{position:relative;flex:1 1 auto;min-height:150px;display:flex;align-items:center;justify-content:center}
#sky-map{width:100%;height:100%;max-height:440px}
#sky-map .ring{fill:none;stroke:rgba(255,255,255,.1);stroke-dasharray:2 6}
.cline{fill:none;stroke:rgba(255,236,214,.85);stroke-width:1.2;stroke-linecap:round;transition:stroke-dashoffset 1.5s var(--ease)}
.cline.x{stroke:rgba(200,190,255,.45);stroke-width:.8}
.cstar{cursor:pointer}
.cstar .in{transform-origin:0 0;animation:starBorn 1.2s var(--ease) both}
@keyframes starBorn{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.5) rotate(10deg);opacity:1}100%{transform:scale(1)}}
.cstar .halo{animation:halo 3.4s ease-in-out infinite;transform-origin:0 0;transform-box:view-box}
.cstar.her path{fill:#ffd9e6}.cstar.him path{fill:#bfe0ff}.cstar.solo path{fill:#fff3d6}
#sky-name{font-family:var(--serif);font-style:italic;font-size:22px;fill:#fff;text-anchor:middle;letter-spacing:.04em;filter:drop-shadow(0 0 8px rgba(255,214,232,.9))}
#sky-name tspan{opacity:0;animation:fadeIn .8s ease forwards}
#sky-sub{font-size:8px;letter-spacing:.3em;fill:rgba(255,255,255,.55);text-anchor:middle;text-transform:uppercase}
#btn-scope{position:absolute;right:0;bottom:0;width:56px;height:56px;opacity:.7}
#btn-scope svg{width:100%;height:100%}
#sky-panel{flex:none;border-radius:26px;padding:18px 16px 16px;background:rgba(22,22,70,.6);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .4s ease;max-height:62%;overflow:auto}
#sky-panel.swap{opacity:0}
#sky-panel .who{display:inline-block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;padding:5px 12px;border-radius:999px;margin-bottom:8px;background:rgba(255,255,255,.1)}
#sky-panel .who.her{color:#ffd9e6}.who.him{color:#bfe0ff}
#sky-panel h3{font-family:var(--serif);font-weight:400;font-size:clamp(18px,4.9vw,22px);line-height:1.3;text-align:center;margin-bottom:12px}
#sky-panel .lead{text-align:center;color:var(--ink-soft);font-size:15px;margin-bottom:14px}
#sky-panel .choices{margin-top:0;gap:8px}
#sky-panel .choice{min-height:46px;padding:10px 14px;font-size:15px}
.own{display:flex;gap:8px;margin-top:8px}
.own .field{text-align:left;min-height:46px;font-size:16px;padding:8px 14px}
.own .btn{flex:none;min-height:46px;padding:8px 16px}
.q-prog{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.q-prog i{width:14px;height:3px;border-radius:2px;background:rgba(255,255,255,.2)} .q-prog i.on{background:var(--gold)}
.row-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.png-prev{width:100%;border-radius:16px;border:1px solid rgba(255,255,255,.2)}
.planet-art{width:150px;height:150px;margin:0 auto 8px}

/* ---------- ПОСЛЕДНЯЯ СТАНЦИЯ ---------- */
.phase{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 70px) 24px calc(var(--safe-b) + 28px);text-align:center}
.phase.on{display:flex;animation:fadeIn 1.4s ease both}
#ph-door{justify-content:flex-start}
#ph-door .door-art{flex:1;width:100%;min-height:0;max-height:54%;margin-top:auto}
#ph-door .door-art svg{width:100%;height:100%}
#ph-door .txt{min-height:150px;display:flex;flex-direction:column;justify-content:center}
#ph-door .txt p{font-family:var(--serif);font-size:clamp(19px,5.2vw,24px);line-height:1.45;margin-bottom:.6em}
#ph-door .acts{display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:10px;min-height:60px}
.bigdoor .dl{transform-origin:150px 300px;transition:transform 2.6s var(--ease)} .bigdoor .dr{transform-origin:250px 300px;transition:transform 2.6s var(--ease)}
.bigdoor.open .dl{transform:scaleX(.08)} .bigdoor.open .dr{transform:scaleX(.08)}
.bigdoor .rays{transform-origin:200px 250px;animation:spin 80s linear infinite;opacity:.5}
.bigdoor .inner{animation:halo 4s ease-in-out infinite;transform-origin:200px 260px}
.compo{position:relative;width:min(86vw,50vh,430px);aspect-ratio:1;flex:none}
.compo svg.links{position:absolute;inset:0;width:100%;height:100%}
.compo .lk{stroke:rgba(255,236,214,.7);stroke-width:.4;fill:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--ease)}
.compo .lk.on{stroke-dashoffset:0}
.medal{position:absolute;width:23%;aspect-ratio:1;margin:-11.5%;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(120,100,210,.25));border:1px solid rgba(255,255,255,.4);box-shadow:0 0 30px rgba(255,214,232,.4);
  opacity:0;transform:scale(.2);transition:opacity 1s,transform 1.2s var(--ease),left 2.2s var(--ease),top 2.2s var(--ease)}
.medal.on{opacity:1;transform:scale(1)} .medal.merge{left:50%!important;top:50%!important;transform:scale(.2);opacity:0}
.medal svg{width:62%;height:62%} .medal .num{font-family:var(--serif);font-size:clamp(20px,6vw,28px);color:var(--gold)}
.orbc{position:absolute;left:50%;top:50%;width:26%;aspect-ratio:1;margin:-13%;border-radius:50%;opacity:0;transform:scale(.2);
  background:radial-gradient(circle,#fff,#ffe3ee 40%,rgba(247,185,208,0) 70%);transition:opacity 2s,transform 2.4s var(--ease)}
.orbc.on{opacity:1;transform:scale(1)} .orbc.big{transform:scale(2.6);opacity:0}
#compo-cap{min-height:64px;margin-top:22px;font-family:var(--serif);font-style:italic;font-size:clamp(18px,5vw,22px);max-width:360px}
#reveal-lines{min-height:210px;display:flex;align-items:center;justify-content:center;max-width:420px}
#reveal-lines p{font-family:var(--serif);font-size:clamp(21px,5.8vw,28px);line-height:1.45;text-shadow:0 0 30px rgba(255,214,232,.5)}
#reveal-acts{min-height:120px;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
#letter .paper{position:relative;width:min(100%,480px);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:10px 10px 22px 22px;padding:34px 26px 28px;color:#3b2b55;text-align:left;
  background:linear-gradient(180deg,#fffaf3,#fdeef2 70%,#f1e8fd);box-shadow:0 30px 80px rgba(4,4,24,.6),0 0 80px rgba(255,214,232,.3);
  animation:unfold 1.4s var(--ease) both;transform-origin:top}
@keyframes unfold{from{opacity:0;transform:perspective(900px) rotateX(-50deg) scaleY(.5)}to{opacity:1;transform:none}}
#letter .paper h3{font-family:var(--serif);font-style:italic;font-weight:400;font-size:28px;margin-bottom:16px;color:#5a3b86}
#letter .paper p{font-family:var(--serif);font-size:18px;line-height:1.66;margin-bottom:1em;-webkit-user-select:text;user-select:text}
#letter .paper .sign{text-align:right;font-style:italic;font-size:20px;color:#5a3b86;margin-top:1.4em}
#letter .paper .l-acts{margin-top:26px;display:flex;flex-direction:column;gap:10px;align-items:center}
#letter .paper .btn.primary{color:#2a1d4d}
#letter .paper .btn.ghost{color:#6b5590;border-color:rgba(90,60,130,.3)}
.big-line{font-family:var(--serif);font-style:italic;font-size:clamp(28px,8vw,44px);line-height:1.25;text-shadow:0 0 40px rgba(255,214,232,.7)}
.sub-line{color:var(--ink-soft);margin:14px auto 26px;max-width:340px;font-size:16px}
#ph-his .hold{margin-top:6px}
#ph-end .end-map{width:min(74vw,36vh,330px);aspect-ratio:1;margin-bottom:8px}
#ph-end .end-map svg{width:100%;height:100%}
#ph-end .names{font-family:var(--serif);font-size:19px;letter-spacing:.06em;color:#ffe9f1;margin-bottom:16px}
#ph-end .final{font-family:var(--serif);font-style:italic;font-size:clamp(24px,6.6vw,34px);line-height:1.3;max-width:420px;text-shadow:0 0 40px rgba(255,214,232,.7)}
#ph-end .ps{min-height:52px;margin-top:14px;font-family:var(--serif);font-style:italic;color:var(--gold);font-size:17px;max-width:360px}
#end-star{width:56px;height:56px;margin-top:8px} #end-star svg{width:26px;height:26px;margin:auto;animation:twk 3s ease-in-out infinite;transform-origin:center}
#ph-end .btn{margin-top:6px}

/* ---------- конверт ---------- */
.env-stage{position:relative;width:min(84vw,340px);aspect-ratio:1.45;perspective:900px;transition:transform 1.2s var(--ease),opacity 1s}
.env{position:absolute;inset:0;transition:transform 1.2s var(--ease),opacity 1s ease}
.env-back{position:absolute;inset:0;border-radius:10px;background:linear-gradient(160deg,#f6d4e3,#e2c9f2)}
.env-letter{position:absolute;left:6%;right:6%;top:8%;bottom:6%;border-radius:6px;background:linear-gradient(180deg,#fffaf3,#fff0f4);transition:transform 1.3s var(--ease);
  box-shadow:0 2px 10px rgba(60,30,90,.18)}
.env-letter::before{content:"";position:absolute;left:12%;right:12%;top:18%;height:38%;background:repeating-linear-gradient(180deg,rgba(120,90,160,.28) 0 2px,transparent 2px 12px)}
.env-front{position:absolute;inset:0;border-radius:10px;background:linear-gradient(200deg,#fde6ef,#eedcf9);
  clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);box-shadow:0 20px 50px rgba(4,4,24,.5)}
.env-flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:top;transition:transform 1.1s var(--ease);z-index:3;
  background:linear-gradient(180deg,#f9c9dc,#f3d6ea);clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 4px rgba(60,30,90,.25))}
.env-seal{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-28px 0 0 -32px;z-index:4;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#ff9fc0,#d9588f 60%,#a83a6e);box-shadow:0 4px 12px rgba(80,20,50,.5),0 0 30px rgba(247,160,196,.6);
  transition:transform .6s var(--ease),opacity .6s;animation:btnGlow 2.6s ease-in-out infinite}
.env-seal svg{width:28px;height:28px}
.env-stage.s1 .env-seal{transform:scale(1.5);opacity:0;pointer-events:none}
.env-stage.s1 .env-flap{transform:rotateX(180deg);z-index:0}
.env-stage.s2 .env-letter{transform:translateY(-62%)}
.env-stage.s3{transform:translateY(40vh) scale(.6);opacity:0}
.env-hint{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 40px);text-align:center;color:var(--ink-soft);font-size:14px;transition:opacity .5s}
.env-read{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 18px) 18px calc(var(--safe-b) + 18px)}
.env-read.on{display:flex}
.note{width:min(100%,420px);max-height:100%;overflow:auto;border-radius:8px 8px 18px 18px;padding:30px 24px 22px;color:#3b2b55;text-align:left;
  background:linear-gradient(180deg,#fffaf3,#fdeef2);box-shadow:0 30px 80px rgba(4,4,24,.6);animation:noteIn 1s var(--ease) both}
@keyframes noteIn{from{opacity:0;transform:translateY(-30px) scale(.8)}}
.note .nk{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#a58bc4;margin-bottom:10px}
.note p{font-family:var(--serif);font-size:18.5px;line-height:1.62;margin-bottom:.8em}
.note .btn{display:flex;margin:18px auto 0;color:#6b5590;border-color:rgba(90,60,130,.3)}

/* ---------- тайное небо ---------- */
#sc-aurora .band{position:absolute;left:-30%;width:160%;height:46%;top:6%;border-radius:50%;filter:blur(38px);opacity:.55;mix-blend-mode:screen;animation:aur 13s ease-in-out infinite alternate}
#sc-aurora .band.b1{background:linear-gradient(90deg,transparent,#59f0c2 30%,#a8b8ff 60%,transparent)}
#sc-aurora .band.b2{top:20%;background:linear-gradient(90deg,transparent,#f7a8d0 35%,#8ef0d6 70%,transparent);animation-duration:17s;animation-delay:-5s}
#sc-aurora .band.b3{top:-6%;background:linear-gradient(90deg,transparent 10%,#b79cff 45%,#6fe3ff 75%,transparent);animation-duration:21s;animation-delay:-9s;opacity:.4}
@keyframes aur{from{transform:translateX(-8%) skewX(-10deg) scaleY(.8)}to{transform:translateX(8%) skewX(12deg) scaleY(1.25)}}
#sc-aurora .a-text{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 110px);padding:0 28px;text-align:center;pointer-events:none}
#sc-aurora .a-text p{font-family:var(--serif);font-size:clamp(18px,5vw,23px);line-height:1.45;margin-bottom:.5em;text-shadow:0 0 20px rgba(0,10,40,.9)}
#sc-aurora .a-foot{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 24px);text-align:center}
#sc-aurora .pad{position:absolute;inset:0;touch-action:none}

@media (max-height:640px){
  .card-art{width:84px;height:84px}
  #g-phrase{height:70px} #sc-garden .g-svg{top:calc(var(--safe-t) + 128px)}
  #sky-panel .choice{min-height:42px;padding:8px 12px}
}
@media (prefers-reduced-motion:reduce){
  .cloud-layer i,.wonder .fl,.sway{animation:none!important}
}
/* ---------- дополнения ---------- */
#sc-station,#sc-garden,#sc-last,#sky-mapwrap{touch-action:none}
.stop .nm,.stop .ru{display:block}
.flip{cursor:pointer}
.flip .back{display:flex;flex-direction:column;justify-content:center;gap:6px}
.flip-hint{margin-top:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft)}
.room.lit #rm-bulb{fill:#fff6d6}
.room:not(.lit) #rm-env{pointer-events:none}
.map-train svg{width:100%}
#g-can{display:none}
#g-mound,#g-moundglow{opacity:0;transition:opacity 1.2s}
.planted-on #g-mound{opacity:1} .colored #g-moundglow{opacity:.45}
.card .flower-art{width:150px;height:186px;margin:0 auto 6px}
.card .flower-art svg,.card .con-art svg{width:100%;height:100%}
.card .con-art{width:100%;aspect-ratio:1.05;margin-bottom:4px}
.small-note{font-size:13px;color:var(--ink-soft);margin-top:10px}
.medal svg{overflow:visible}
body{-webkit-touch-callout:none}
#g-hint .txt:empty{display:none}
#intro-lines{transition-duration:.5s}
/* созвездие в маленьких значках: линии и звёзды крупнее */
.medal .cline,.coll .ic .cline{stroke-width:7}
.medal .cstar path,.coll .ic .cstar path{transform:scale(2.8)}
/* запасные размеры для браузеров без aspect-ratio */
.compo{height:min(86vw,50vh,430px)}
.medal{height:23%} .orbc{height:26%}
.env-stage{height:calc(min(84vw,340px) / 1.45)}
#ph-end .end-map{height:min(74vw,36vh,330px)}
@media (max-height:640px){
  #sc-station .art{height:42%}
  .station-ui{top:calc(var(--safe-t) + 64px)}
  #ticket-view .btn{margin-top:12px}
}
</style>
</head>

const hash = str => { let h = 2166136261; for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };

/* ==========================================================================
   Сохранение прогресса (LocalStorage) с безопасным восстановлением
   ========================================================================== */
const Store = {
  KEY: 'our-little-universe.v1',
  defaults() {
    return {
      v: 1, name: '', ticketNo: '', date: '', stage: 0, scene: 'station', introDone: false, sound: null,
      wonders: { found: [], cloudHeart: false, lamp: false, boxTaps: 0, flyTaps: 0 },
      envelopes: [], secrets: [],
      garden: { step: 0, color: null, pours: 0, touches: 0, motes: [], bloomed: false },
      con: { mode: null, answers: [], name: '', done: false },
      finale: { revealed: false, ended: false }
    };
  },
  /* берём из сохранённого только поля ожидаемого типа — повреждённые данные не сломают игру */
  merge(def, src) {
    const out = {};
    for (const k of Object.keys(def)) {
      const d = def[k], s = src ? src[k] : undefined;
      if (Array.isArray(d)) out[k] = Array.isArray(s) ? s.slice(0, 64) : d;
      else if (d === null) out[k] = (typeof s === 'string' || typeof s === 'boolean') ? s : null;
      else if (typeof d === 'object') out[k] = this.merge(d, s && typeof s === 'object' ? s : {});
      else out[k] = typeof s === typeof d ? s : d;
    }
    return out;
  },
  load() {
    let raw = null;
    try { raw = localStorage.getItem(this.KEY); } catch (e) { /* хранилище недоступно — играем без сохранения */ }
    if (!raw) return this.defaults();
    try {
      const s = this.merge(this.defaults(), JSON.parse(raw));
      s.stage = clamp(Math.round(s.stage) || 0, 0, ORDER.length - 1);
      if (!ORDER.includes(s.scene) || ORDER.indexOf(s.scene) > s.stage) s.scene = ORDER[s.stage];
      s.name = String(s.name).slice(0, 24);
      s.wonders.found = s.wonders.found.filter(x => WONDER_IDS.includes(x));
      s.envelopes = s.envelopes.filter(x => x in CONFIG.envelopes);
      s.secrets = s.secrets.filter(x => x in CONFIG.secrets);
      s.garden.step = clamp(Math.round(s.garden.step) || 0, 0, 7);
      s.garden.pours = clamp(s.garden.pours, 0, 3); s.garden.touches = clamp(s.garden.touches, 0, 3);
      s.garden.motes = s.garden.motes.filter(n => Number.isInteger(n) && n >= 0 && n < 5);
      if (!CONFIG.garden.colors.some(c => c.id === s.garden.color)) { s.garden.color = null; if (s.garden.step > 1) s.garden.step = 1; }
      s.con.answers = s.con.answers.filter(a => a && typeof a.a === 'string').slice(0, CONFIG.constellation.questions.length)
        .map(a => ({ a: a.a.slice(0, 80), o: Number.isInteger(a.o) ? a.o : -1 }));
      if (s.con.mode !== 'solo' && s.con.mode !== 'duo') s.con.mode = null;
      if (s.con.answers.length < CONFIG.constellation.questions.length) s.con.done = false;
      if (!s.name) s.introDone = false;
      if (!s.introDone) { s.stage = 0; s.scene = 'station'; }
      return s;
    } catch (e) {
      try { localStorage.setItem(this.KEY + '.broken', raw); } catch (e2) { /* не страшно */ }
      return this.defaults();
    }
  },
  save() { try { localStorage.setItem(this.KEY, JSON.stringify(S)); } catch (e) { /* без сохранения */ } },
  reset() { try { localStorage.removeItem(this.KEY); } catch (e) { /* без сохранения */ } }
};
let S = Store.load();

    get on() { return on; },
    /* включение возможно только из обработчика действия пользователя */
    set(v, remember = true) {

    play(n) { if (!on || !ctx || !SFX[n]) return; try { SFX[n](); } catch (e) { /* тишина */ } }

})();

    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.18, rgba(col, 0.9)); gr.addColorStop(0.5, rgba(col, 0.25)); gr.addColorStop(1, rgba(col, 0));

  function resize() {
    W = window.innerWidth; H = window.innerHeight; dpr = Math.min(window.devicePixelRatio || 1, 2);
    [c1, c2].forEach(c => { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); });
    a.setTransform(dpr, 0, 0, dpr, 0, 0); b.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(280, W * H / 4200) * (reduced ? 0.6 : 1));
    stars = [];
    for (let i = 0; i < n; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), r: Math.random() < 0.08 ? rnd(1.3, 2) : rnd(0.4, 1.15), d: rnd(0.15, 1), ph: rnd(0, 6.28), sp: rnd(0.4, 1.6), a: rnd(0.35, 0.9), c: pick(['#ffffff', '#ffe9f1', '#e6dcff', '#fff3d6', '#d6ecff']) });
  }
  function newFly() { return { x: rnd(0, W), y: rnd(H * 0.15, H), ang: rnd(0, 6.28), v: rnd(0.15, 0.5), ph: rnd(0, 6.28), size: rnd(14, 26), col: pick(['#fff3c0', '#ffe3a3', '#ffd9e6']), life: 0, dying: false }; }

    ptr.px += (ptr.tx - ptr.px) * 0.05 * dt; ptr.py += (ptr.ty - ptr.py) * 0.05 * dt; if (ptr.active > 0) ptr.active -= dt;
    if (tick % 2 === 0) {
      cl1.style.setProperty('--px', (-ptr.px * 12).toFixed(1)); cl1.style.setProperty('--py', (-ptr.py * 5 - st.scroll * 0.02).toFixed(1));
      cl2.style.setProperty('--px', (-ptr.px * 26).toFixed(1)); cl2.style.setProperty('--py', (-ptr.py * 9 - st.scroll * 0.04).toFixed(1));
    }
    /* --- нижний слой: звёзды --- */

    if (st.alpha > 0.01) {
      const glow = sprite('#fff3d6');
      for (const s of stars) {
        let x = s.x - ptr.px * s.d * 22, y = s.y - ptr.py * s.d * 14 - st.scroll * s.d * 0.1;
        x = ((x % W) + W) % W; y = ((y % H) + H) % H;

      const f = flies[i];
      f.life = clamp(f.life + (f.dying ? -0.02 : 0.01) * dt, 0, 1);
      if (f.dying && f.life <= 0) { flies.splice(i, 1); continue; }
      f.ang += rnd(-0.09, 0.09) * dt; f.x += Math.cos(f.ang) * f.v * dt; f.y += Math.sin(f.ang) * f.v * dt;
      if (ptr.active > 0) { const dx = ptr.x - f.x, dy = ptr.y - f.y, d2 = dx * dx + dy * dy; if (d2 < 48000 && d2 > 900) { f.x += dx * 0.012 * dt; f.y += dy * 0.012 * dt; } }
      if (f.x < -30) f.x = W + 30; if (f.x > W + 30) f.x = -30; if (f.y < -30) f.y = H + 30; if (f.y > H + 30) f.y = -30;

    }

      form.cx += (form.tx - form.cx) * 0.03 * dt; form.cy += (form.ty - form.cy) * 0.03 * dt;

        else { const r = Math.sqrt((i + 1) / n) * form.size, ang = r / form.size * 5.2 + (i % 2) * Math.PI + ts * 0.22; gx = form.cx + Math.cos(ang) * r; gy = form.cy + Math.sin(ang) * r * 0.5; }
        p.x += (gx - p.x) * 0.05 * dt + Math.sin(ts * 1.7 + i) * 0.25; p.y += (gy - p.y) * 0.05 * dt + Math.cos(ts * 1.3 + i) * 0.25;

  function spark(x, y, o = {}) {

  }

    burst(x, y, o = {}) { const n = Math.round((o.n || 18) * (reduced ? 0.5 : 1)); for (let i = 0; i < n; i++) spark(x, y, Object.assign({}, o, { col: o.cols ? pick(o.cols) : o.col })); },
    burstAt(el, o) { const c = centerOf(el); this.burst(c.x, c.y, o); },
    trail(x, y, o = {}) { const oo = Object.assign({ speed: 0.5, size: 10, life: 44, g: 0.006 }, o); if (oo.cols) oo.col = pick(oo.cols); spark(x + rnd(-4, 4), y + rnd(-4, 4), oo); },
    stars(target, speed) { st.target = target; st.speed = speed || 0.012; },
    starsNow(v) { st.alpha = st.target = v; },
    twinkle() { st.boost = 0.9; },
    flies(n) { st.flyN = reduced ? Math.ceil(n / 2) : n; },
    scroll(v) { st.scroll = v; },

/* ==========================================================================
   Интерфейс: подсказки, карточки, конверты, кнопка «удерживай»
   ========================================================================== */
const UI = {
  toastT: 0, cardRes: null,
  toast(html, ms = 3400, cls = '') {
    const t = $('#toast'); t.className = cls; t.innerHTML = html; void t.offsetWidth; t.classList.add('on');
    clearTimeout(this.toastT); this.toastT = setTimeout(() => t.classList.remove('on'), ms);
  },
  say(text, ms, extra) { this.toast(esc(fill(text, extra)), ms); },
  chip(html) { $('#hud-chip').innerHTML = html || ''; },
  anyOverlay() { return !!$('.overlay.on') || $('#room').classList.contains('on'); },
  closeOverlay(el) {
    if (!el.classList.contains('on')) return Promise.resolve();
    el.classList.add('closing');
    return wait(330).then(() => { el.classList.remove('on', 'closing'); });
  },
  closeAll() { if (Envelope.cur) Envelope.cur(false); $$('.overlay').forEach(o => o.classList.remove('on', 'closing')); if (this.cardRes) { const r = this.cardRes; this.cardRes = null; r(false); } },
  /* универсальная карточка. Возвращает Promise, который завершается при закрытии */
  card({ kicker = '', title = '', pages = [], art = '', closeLabel = T.close, custom = null, actions = null, dismiss = true } = {}) {
    if (this.cardRes) { const r = this.cardRes; this.cardRes = null; r(false); }
    return new Promise(res => {
      const m = $('#modal'), pg = [].concat(pages).filter(Boolean).map(p => fill(p)); let i = 0, closed = false;
      m.innerHTML = `<div class="card" role="dialog" aria-modal="true">${art ? `<div class="card-art">${art}</div>` : ''}${kicker ? `<div class="kicker">${esc(fill(kicker))}</div>` : ''}${title ? `<h3>${esc(fill(title))}</h3>` : ''}<div class="card-body"></div>${pg.length > 1 ? `<div class="card-dots">${pg.map(() => '<i></i>').join('')}</div>` : ''}<div class="card-actions"></div></div>`;
      const body = $('.card-body', m), acts = $('.card-actions', m);
      this.cardRes = res;
      const close = val => {
        if (closed) return; closed = true; if (this.cardRes === res) this.cardRes = null;
        this.closeOverlay(m).then(() => { if (!this.cardRes) m.innerHTML = ''; res(val); });
      };
      const render = () => {
        body.innerHTML = pg.length ? para(pg[i]) : '';
        $$('.card-dots i', m).forEach((d, k) => d.classList.toggle('on', k === i));
        if (custom || actions) return;
        acts.innerHTML = '';
        const more = i < pg.length - 1, bt = mkBtn(more ? T.next : closeLabel, more ? 'btn' : 'btn primary');
        bt.onclick = () => {
          Sound.play('tap');
          if (more) { body.classList.add('swap'); setTimeout(() => { i++; render(); body.classList.remove('swap'); }, 300); } else close(true);
        };
        acts.appendChild(bt);
      };
      render();
      if (custom) custom({ body, acts, close, card: $('.card', m) });
      if (actions) actions.forEach(ac => { const bt = mkBtn(ac.label, ac.cls || 'btn'); bt.onclick = () => { Sound.play('tap'); close(ac.value); }; acts.appendChild(bt); });
      m.classList.remove('closing'); m.classList.add('on');
      m.onclick = e => { if (dismiss && e.target === m && i >= pg.length - 1) close(false); };
    });
  },
  /* кнопка, которую нужно удерживать (защита от случайных нажатий) */
  hold(el, ms, done) {
    let t = 0, fired = false;
    el.style.setProperty('--hold-ms', ms + 'ms'); el.style.touchAction = 'none';
    const start = e => { if (e.cancelable) e.preventDefault(); if (fired) return; el.classList.add('pressing'); Sound.play('soft'); clearTimeout(t); t = setTimeout(() => { fired = true; el.classList.remove('pressing'); done(); }, ms); };
    const stop = () => { clearTimeout(t); el.classList.remove('pressing'); };
    el.addEventListener('pointerdown', start);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => el.addEventListener(n, stop));
    el.addEventListener('contextmenu', e => e.preventDefault());
    el.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) start(e); });
    el.addEventListener('keyup', stop);
  },
  holdHTML(cls = '', inner = '') { return `<button class="hold ${cls}" type="button"><svg class="ring" viewBox="0 0 132 132"><circle cx="66" cy="66" r="62"/></svg>${inner}</button>`; }
};

/* строки, появляющиеся по одной. accumulate=true — копятся; false — сменяют друг друга.
   Касание ускоряет показ. Возвращает false, если сцену покинули. */
async function revealLines(box, lines, { gap = 2500, accumulate = true, tapEl = box, tok = 0 } = {}) {
  box.innerHTML = '';
  let skip = null; const onTap = () => { if (skip) skip(); };
  tapEl.addEventListener('pointerdown', onTap);
  try {
    for (let i = 0; i < lines.length; i++) {
      const text = fill(lines[i]), p = document.createElement('p'); p.className = 'rl'; p.textContent = text;
      box.appendChild(p); await wait(40); if (tok !== App.token) return false;
      p.classList.add('in'); Sound.play('soft');
      const hold = gap + text.length * 38;
      await wait(700);
      await new Promise(r => { const t = setTimeout(r, hold); skip = () => { clearTimeout(t); r(); }; });
      skip = null; if (tok !== App.token) return false;
      if (!accumulate && i < lines.length - 1) { p.classList.remove('in'); p.classList.add('out'); await wait(900); p.remove(); }
    }
    return tok === App.token;
  } finally { tapEl.removeEventListener('pointerdown', onTap); }
}

/* конверт с печатью, клапаном и выезжающим письмом */
const Envelope = {
  cur: null,
  open(id) {
    return new Promise(res => {
      const cfg = CONFIG.envelopes[id]; if (!cfg) return res(false);
      const o = $('#envelope'), st = $('#env-stage'), rd = $('#env-read'), hint = $('#env-hint'), seal = $('#env-seal');
      st.className = 'env-stage'; rd.className = 'env-read'; rd.innerHTML = ''; hint.textContent = T.envHint; hint.style.opacity = 1;
      o.classList.remove('closing'); o.classList.add('on');
      let opened = false, done = false;
      const finish = v => { if (done) return; done = true; this.cur = null; UI.closeOverlay(o); res(v); };
      this.cur = finish;
      o.onclick = e => { if (e.target === o && !opened) finish(false); };
      seal.onclick = async () => {
        if (opened) return; opened = true; Sound.play('paper'); hint.style.opacity = 0;
        FX.burstAt(seal, { n: 16, cols: ['#ffc2d9', '#fff3c0', '#ffffff'], speed: 2.4 });
        st.classList.add('s1'); await wait(950);
        st.classList.add('s2'); await wait(1250);
        st.classList.add('s3'); await wait(450);
        rd.innerHTML = `<div class="note"><div class="nk">${esc(cfg.kicker)}</div>${para(fill(cfg.text))}<button class="btn ghost" type="button">${esc(T.envClose)}</button></div>`;
        rd.classList.add('on');
        if (!S.envelopes.includes(id)) { S.envelopes.push(id); Store.save(); }
        $('button', rd).onclick = () => { Sound.play('tap'); finish(true); };
      };
    });
  }
};

/* ==========================================================================
   Секреты (пасхалки): учёт и красивое уведомление
   ========================================================================== */
const Secret = {
  has(id) { return S.secrets.includes(id); },
  find(id, delay = 0) {
    if (this.has(id) || !CONFIG.secrets[id]) return false;
    S.secrets.push(id); Store.save();
    const c = CONFIG.secrets[id];
    setTimeout(() => {
      Sound.play('secret'); FX.twinkle();
      UI.toast(`<b>${esc(T.secretFound)} · ${esc(c.title)}</b>${esc(fill(c.text))}`, 5200, 'secret');
      if (App.current && Scenes[App.current].chip) Scenes[App.current].chip();
    }, delay);
    return true;
  }
};

/* ==========================================================================
   Маленькие иллюстрации, которые нужны в нескольких местах

    for (let i = 0; i < 8; i++) p += `<path transform="rotate(${i * 45 + 22.5}) scale(.62)" d="M0 0C-20-20-18-52 0-66 18-52 20-20 0 0Z" fill="${c.light}"/>`;
    return `<svg viewBox="-80 -80 160 200"><path d="M0 0C-4 40 6 80 0 118" fill="none" stroke="#7fcfb5" stroke-width="5" stroke-linecap="round"/><path d="M0 84C-20 78-32 64-34 50-16 52-4 64 0 84Z" fill="#9fe0c8"/><path d="M1 60C20 54 32 40 34 27 17 29 5 40 1 60Z" fill="#b5ebd6"/><circle r="74" fill="url(#gPinkGlow)" opacity=".5"/>${p}<circle r="11" fill="url(#gGold)"/></svg>`;
  },
  ticketIcon() { return `<svg viewBox="0 0 100 100"><rect x="10" y="28" width="80" height="44" rx="8" fill="url(#gRose)" stroke="#fff"/><path d="M66 28v44" stroke="#fff" stroke-dasharray="4 4"/><use href="#s-star" x="24" y="38" width="24" height="24" fill="#fff"/></svg>`; },

      <div class="t-row"><div><span>Дата</span>${esc(S.date)}</div><div><span>Место</span>${esc(t.seat)}</div></div></div>
